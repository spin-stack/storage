version: "3"

# The guest lane's one artefact: the initramfs, built here from a static Go /init.
#
# The kernel is not here and never was built here. It arrives with the rest of the machine
# — see taskfiles/machine.yml — and this file used to carry five targets and two scripts
# whose only job was moving somebody else's kernel through a registry so that a machine
# with no sibling checkout could find one. That is what having the machine in one place
# replaced.

tasks:

  guest:build:
    desc: Build the initramfs the guest lane boots (a static Go /init). The kernel comes with the machine (`task machine`).
    sources:
      - integration/guestinit/**/*.go
      - hack/build-guest-initramfs.sh
    generates:
      - '{{.OUTPUT_DIR}}/guest/initramfs.cpio.gz'
    cmds:
      - OUT_DIR={{.OUTPUT_DIR}}/guest bash hack/build-guest-initramfs.sh

  guest:verify:
    desc: Assert the guest lane's inputs — the initramfs we build, and the kernel that comes with the machine.
    deps: [guest:build, machine]
    cmds:
      # The artefact is opened, not stat'ed: `test -f` says OK for a zero-byte file, a
      # half-written one and an archive with no /init, and `guest:build` fingerprints its
      # *sources*, so a truncated artefact is "up to date" (verified 2026-08-04 by emptying
      # the file: the old target printed OK and exited 0). cpio is required, not optional.
      - |
        set -euo pipefail
        img={{.OUTPUT_DIR}}/guest/initramfs.cpio.gz
        test -f "$img" || { echo "no initramfs at $img — run: task guest:build" >&2; exit 1; }
        command -v cpio >/dev/null || {
          echo "cpio is missing, so $img cannot be inspected (apt-get install cpio)" >&2; exit 1; }
        gzip -t "$img" 2>/dev/null || {
          echo "$img is not a valid gzip stream — a truncated or interrupted build; rebuild: task guest:build" >&2
          exit 1; }
        # ./init is the whole contract with the kernel: it mounts the archive as rootfs and
        # execs /init, and an archive without one panics with "no working init found",
        # which reads like a kernel problem rather than a missing build step.
        listing=$(gzip -dc "$img" | cpio --list --quiet 2>/dev/null || true)
        grep -qE '^(\./)?init$' <<<"$listing" || {
          echo "$img contains no ./init — the kernel would mount it and panic with no PID 1; rebuild: task guest:build" >&2
          exit 1; }
        echo "OK: $img — gzip cpio carrying ./init"
      # The kernel is checked by opening it too, and for the same reason as the initramfs:
      # what makes it bootable here is not its size. QEMU enters this ELF through pvh.bin
      # using the Xen notes in its program headers, and a kernel without them fails at
      # start-up as a rom-open error that reads like a backend bug.
      - |
        set -euo pipefail
        k={{.GUEST_KERNEL}}
        test -f "$k" || { echo "no kernel at $k — run: task machine" >&2; exit 1; }
        readelf -n "$k" 2>/dev/null | grep -qi xen || {
          echo "$k carries no Xen PVH notes — QEMU has no entry point into it" >&2; exit 1; }
        echo "OK: $k — PVH notes present"
