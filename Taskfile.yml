version: "3"

# Build/test/lint/dst orchestration for github.com/spin-stack/storage.
# Mirrors the sibling spin-stack projects (go-task). The `ci` target is the
# aggregate gate wired into GitHub Actions (CLAUDE.md, "The gate").
#
# Reproducibility rule: every tool this project needs is pinned here and installed
# into ./.tools/bin by `task tools`. Nothing depends on what happens to be on the
# developer's PATH, and no task downloads an unpinned "latest". If you find yourself
# typing `sqlc`, `pgschema`, `golangci-lint`, or `gofmt` by hand, that is a missing
# task.

vars:
  SIMULABLE: ./hack/analyzers/simulable/cmd/simulable
  # Project-local tool bin. Committed to .gitignore; rebuilt by `task tools`.
  TOOLS_BIN: "{{.ROOT_DIR}}/.tools/bin"
  OUTPUT_DIR: "{{.ROOT_DIR}}/_output"
  # Project-local by default so no task needs root; override for a shared CI cache.
  BUILDKIT_CACHE_DIR: '{{.BUILDKIT_CACHE_DIR | default (printf "%s/.cache/buildkit" .ROOT_DIR)}}'
  BUILDKIT_CACHE_QEMU: '{{.BUILDKIT_CACHE_DIR}}/storage-qemu'
  # QEMU is pinned here and in CLAUDE.md; the same version runs in CI and prod.
  QEMU_VERSION: 11.0.2
  QEMU_JOBS: '{{.QEMU_JOBS | default 8}}'
  # BuildKit cache backends. Local by default (a laptop); CI overrides them with
  # `type=gha` so the build is not duplicated in a workflow file — the Dockerfile and
  # the flags stay in one place, which is the rule the whole Taskfile exists for.
  QEMU_CACHE_FROM: '{{.QEMU_CACHE_FROM | default (printf "type=local,src=%s" .BUILDKIT_CACHE_QEMU)}}'
  QEMU_CACHE_TO: '{{.QEMU_CACHE_TO | default (printf "type=local,dest=%s,mode=max,compression=zstd" .BUILDKIT_CACHE_QEMU)}}'
  # Where the runtime image is published. Overridden in CI with the GitHub Packages
  # path; the default is a local tag so `task build:qemu:image` needs no registry.
  QEMU_IMAGE: '{{.QEMU_IMAGE | default "spin-stack/storage-qemu"}}'
  # Object-store backend under test (§6.1 conformance suite). Pinned by digest so a
  # re-tagged image cannot silently change what the suite certified.
  RUSTFS_IMAGE: "rustfs/rustfs:latest@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c"
  # --- pinned tool versions (the single place each is declared) ---
  SQLC_VERSION: v1.30.0
  PGSCHEMA_VERSION: v1.12.0
  # Postgres for every schema task. The same tag the integration lane starts with
  # TestContainers, so `task db:plan` and the tests can never disagree about what
  # the server accepts.
  POSTGRES_IMAGE: postgres:18-alpine
  DEVDB_CONTAINER: spin-storage-devdb
  DEVDB_PORT: '{{.DEVDB_PORT | default "55432"}}'
  # --- the guest kernel (ADR-0021, ADR-0022) ---
  # storage does not build a kernel: it consumes spinbox's artefact, never its code.
  # The lane reads it from ONE canonical path, and `task fetch:kernel` puts it there
  # from whichever source is available. Nothing else resolves a kernel path.
  GUEST_KERNEL: '{{.OUTPUT_DIR}}/guest/vmlinux'
  # Pinned by content, the same rule as RUSTFS_IMAGE: "which kernel did the lane
  # certify" has to have an answer that is not "whatever was in _output that day".
  # Bump deliberately with `task guest:kernel:pin` and say in the commit why it moved.
  GUEST_KERNEL_VERSION: 7.1.0
  GUEST_KERNEL_SHA256: 76524fa7fd541f725265a1721e1a602be3bdb943e793950b76dec2f8e56848e2
  # Source 1: a sibling spinbox checkout that has already built one (no network).
  SPINBOX_KERNEL: '{{.SPINBOX_KERNEL | default "../spinbox/_output/spinbox-kernel-x86_64"}}'
  # Source 2: the mirror. Unset by default — nothing is published yet — so the failure
  # of `task fetch:kernel` on a machine with no spinbox checkout names it as missing
  # rather than pointing at a registry path that answers 404.
  GUEST_KERNEL_IMAGE: '{{.GUEST_KERNEL_IMAGE | default ""}}'
  # Target database for db:plan / db:apply — the local development database by
  # default. Point DB_* at a real one to plan or apply against it; the password
  # comes from the environment (PGPASSWORD), never from a var in this file.
  DB_HOST: '{{.DB_HOST | default "localhost"}}'
  DB_PORT: '{{.DB_PORT | default .DEVDB_PORT}}'
  DB_NAME: '{{.DB_NAME | default "cp"}}'
  DB_USER: '{{.DB_USER | default "cp"}}'
  # Flags for the database being changed.
  PGSCHEMA_TARGET: --host {{.DB_HOST}} --port {{.DB_PORT}} --db {{.DB_NAME}} --user {{.DB_USER}} --sslmode disable
  # Flags for the scratch database pgschema materializes the desired state in while
  # diffing. Always given explicitly: with no --plan-host, pgschema downloads and
  # runs an embedded PostgreSQL of its own choosing at plan time — unpinned, and not
  # the version this project targets.
  PGSCHEMA_PLAN: --plan-host {{.DB_HOST}} --plan-port {{.DB_PORT}} --plan-db {{.DB_NAME}} --plan-user {{.DB_USER}} --plan-sslmode disable
  # Protobuf/Connect toolchain (ADR-0018). protoc itself is never used: buf
  # compiles the schema and drives the two plugins. PROTOC_GEN_GO_VERSION must
  # match the google.golang.org/protobuf version in go.mod, and
  # PROTOC_GEN_CONNECT_GO_VERSION the connectrpc.com/connect one — a plugin
  # newer than its runtime generates code the module cannot compile.
  BUF_VERSION: v1.72.0
  PROTOC_GEN_GO_VERSION: v1.36.11
  PROTOC_GEN_CONNECT_GO_VERSION: v1.20.0
  # golangci-lint v2 also owns formatting (gofmt + goimports are configured as
  # `formatters` in .golangci.yml), so there is exactly one formatter binary.
  GOLANGCI_VERSION: v2.12.2
  # `deadcode` ships in golang.org/x/tools, which this module already requires (the
  # simulable analyzer is built on go/analysis). It is pinned to the *same* version as
  # go.mod's, and `tools:deadcode` refuses to install when the two disagree: an analyzer
  # built against a different x/tools than the tree compiles with answers about a
  # different program than the one this repository ships.
  XTOOLS_VERSION: v0.43.0

tasks:
  default:
    cmds:
      - task: ci

  # --- tools -----------------------------------------------------------------

  tools:
    desc: Install every pinned tool into ./.tools/bin (sqlc, pgschema, golangci-lint, buf + proto plugins).
    cmds:
      - task: tools:sqlc
      - task: tools:pgschema
      - task: tools:golangci
      - task: tools:buf
      - task: tools:protoc-plugins
      - task: tools:deadcode

  tools:sqlc:
    desc: Install the pinned sqlc.
    status:
      - test -x {{.TOOLS_BIN}}/sqlc && {{.TOOLS_BIN}}/sqlc version | grep -q '{{.SQLC_VERSION}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}

  tools:pgschema:
    desc: Install the pinned pgschema (ADR-0019) — the schema tool.
    # Built from source at an exact tag rather than downloading a release binary:
    # the module proxy and go.sum give the same reproducibility a published
    # checksum would, through the toolchain every other tool here already uses.
    status:
      - test -x {{.TOOLS_BIN}}/pgschema && {{.TOOLS_BIN}}/pgschema --help | grep -q '{{.PGSCHEMA_VERSION | trimPrefix "v"}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install github.com/pgplex/pgschema@{{.PGSCHEMA_VERSION}}

  tools:golangci:
    desc: Install the pinned golangci-lint v2.
    status:
      - test -x {{.TOOLS_BIN}}/golangci-lint && {{.TOOLS_BIN}}/golangci-lint version | grep -q '{{.GOLANGCI_VERSION | trimPrefix "v"}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}

  tools:buf:
    desc: Install the pinned buf (ADR-0018) — the only protobuf compiler this project uses.
    status:
      - test -x {{.TOOLS_BIN}}/buf && {{.TOOLS_BIN}}/buf --version | grep -q '{{.BUF_VERSION | trimPrefix "v"}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}

  tools:protoc-plugins:
    desc: Install the pinned protoc-gen-go and protoc-gen-connect-go (ADR-0018).
    status:
      - test -x {{.TOOLS_BIN}}/protoc-gen-go && {{.TOOLS_BIN}}/protoc-gen-go --version | grep -q '{{.PROTOC_GEN_GO_VERSION}}'
      - test -x {{.TOOLS_BIN}}/protoc-gen-connect-go && {{.TOOLS_BIN}}/protoc-gen-connect-go --version | grep -q '{{.PROTOC_GEN_CONNECT_GO_VERSION | trimPrefix "v"}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - GOBIN={{.TOOLS_BIN}} go install connectrpc.com/connect/cmd/protoc-gen-connect-go@{{.PROTOC_GEN_CONNECT_GO_VERSION}}

  tools:deadcode:
    desc: Install the pinned golang.org/x/tools/cmd/deadcode (the `deadcode` task's analyzer).
    # The status reads the version out of the built binary rather than trusting the file
    # exists: `go version -m` prints the module the binary was built from, so a stale
    # .tools/bin from an older pin reinstalls instead of silently reporting on the wrong
    # analysis.
    status:
      - test -x {{.TOOLS_BIN}}/deadcode && go version -m {{.TOOLS_BIN}}/deadcode | grep -qE 'mod[[:space:]]+golang.org/x/tools[[:space:]]+{{.XTOOLS_VERSION}}'
    preconditions:
      - sh: grep -q 'golang.org/x/tools {{.XTOOLS_VERSION}}$' go.mod
        msg: "XTOOLS_VERSION ({{.XTOOLS_VERSION}}) is not the golang.org/x/tools in go.mod — bump both together."
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install golang.org/x/tools/cmd/deadcode@{{.XTOOLS_VERSION}}

  # --- code generation and migrations ----------------------------------------

  generate:
    desc: Regenerate every committed generated artifact (sqlc + protobuf/Connect).
    cmds:
      - task: generate:sqlc
      - task: generate:proto

  generate:check:
    desc: Fail if any committed generated output is stale.
    cmds:
      - task: generate:sqlc:check
      - task: generate:proto:check

  generate:sqlc:
    desc: Regenerate sqlc code from schema + queries.
    deps: [tools:sqlc]
    cmds:
      - "{{.TOOLS_BIN}}/sqlc generate"

  generate:sqlc:check:
    desc: Fail if the committed sqlc output is stale (generate produced a diff).
    deps: [tools:sqlc]
    cmds:
      - "{{.TOOLS_BIN}}/sqlc generate"
      # Only the generated files: hand-written tests living in internal/db must not
      # make this fail (it is about staleness, not about uncommitted work).
      - git diff --exit-code -- 'internal/db/*.go' ':!internal/db/*_test.go'

  generate:proto:
    desc: Regenerate the protobuf + Connect stubs in api/gen (ADR-0018).
    deps: [tools:buf, tools:protoc-plugins]
    dir: api
    cmds:
      - "{{.TOOLS_BIN}}/buf generate"

  generate:proto:check:
    desc: Fail if the committed protobuf/Connect output is stale.
    deps: [tools:buf, tools:protoc-plugins]
    cmds:
      - task: generate:proto
      - git diff --exit-code -- api/gen

  lint:proto:
    desc: Lint and format-check the protobuf schema (buf STANDARD).
    deps: [tools:buf]
    dir: api
    cmds:
      - "{{.TOOLS_BIN}}/buf lint"
      - "{{.TOOLS_BIN}}/buf format --diff --exit-code"

  # --- schema (pgschema, ADR-0019) --------------------------------------------
  #
  # internal/schema/schema.sql is the declared state; pgschema computes the DDL that
  # takes a live database there. There is no history table and no checksum chain, so
  # the reviewable record is the plan itself: `db:plan` writes one into migrations/,
  # and `db:apply` executes *that file*. Reviewing plan A and applying a plan B
  # recomputed at deploy time is the failure mode a state-based tool invites; the
  # only apply path here reads a committed plan, and pgschema refuses it if the
  # database has moved since it was made.

  db:dev:up:
    desc: Start (or reuse) the local Postgres 18 development database that db:plan diffs against.
    cmds:
      - POSTGRES_IMAGE={{.POSTGRES_IMAGE}} DEVDB_CONTAINER={{.DEVDB_CONTAINER}} DEVDB_PORT={{.DEVDB_PORT}} bash hack/db.sh up

  db:dev:down:
    desc: Remove the local development database.
    cmds:
      - DEVDB_CONTAINER={{.DEVDB_CONTAINER}} POSTGRES_IMAGE={{.POSTGRES_IMAGE}} bash hack/db.sh down

  db:plan:
    desc: "Plan schema.sql against the development database; commit the result under migrations/. Usage: task db:plan -- <name>"
    deps: [tools:pgschema, db:dev:up]
    cmds:
      - |
        set -euo pipefail
        name='{{.CLI_ARGS}}'
        test -n "$name" || { echo "usage: task db:plan -- <name>   (e.g. task db:plan -- revocation_window)"; exit 1; }
        out="migrations/$(date -u +%Y%m%d%H%M%S)_${name}"
        export PGPASSWORD="${PGPASSWORD:-cp}" PGSCHEMA_PLAN_PASSWORD="${PGSCHEMA_PLAN_PASSWORD:-$PGPASSWORD}"
        {{.TOOLS_BIN}}/pgschema plan {{.PGSCHEMA_TARGET}} {{.PGSCHEMA_PLAN}} \
          --file internal/schema/schema.sql --no-color \
          --output-human stdout --output-sql "$out.sql" --output-json "$out.json"
        if ! grep -q '[^[:space:]]' "$out.sql"; then
          rm -f "$out.sql" "$out.json"
          echo "nothing to plan: the database already matches internal/schema/schema.sql"
          exit 0
        fi
        echo
        echo "wrote $out.sql (review this) and $out.json (what db:apply executes)"

  db:apply:
    desc: "Apply a saved plan — never a recomputed one. Usage: task db:apply PLAN=migrations/<file>.json"
    deps: [tools:pgschema]
    cmds:
      - |
        set -euo pipefail
        plan='{{.PLAN}}'
        test -n "$plan" || { echo "usage: task db:apply PLAN=migrations/<timestamp>_<name>.json"; exit 1; }
        export PGPASSWORD="${PGPASSWORD:-cp}"
        {{.TOOLS_BIN}}/pgschema apply {{.PGSCHEMA_TARGET}} --plan "$plan" {{if .AUTO_APPROVE}}--auto-approve{{end}}

  db:verify:
    desc: Apply schema.sql to an empty Postgres 18 and assert a plan against the result has nothing to do (replaces atlas.sum).
    deps: [tools:pgschema]
    cmds:
      - PGSCHEMA={{.TOOLS_BIN}}/pgschema POSTGRES_IMAGE={{.POSTGRES_IMAGE}} bash hack/db.sh verify

  # --- infrastructure (QEMU, object-store backend) ----------------------------

  build:qemu:
    desc: "Build the pinned QEMU (vhost-user-blk + storage daemon) into _output/ (§3, Phases 02/03)."
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - |
        docker buildx build \
          --file Dockerfile.qemu \
          --target extract \
          --platform linux/amd64 \
          --cache-from {{.QEMU_CACHE_FROM}} \
          --cache-to {{.QEMU_CACHE_TO}} \
          --build-arg QEMU_VERSION={{.QEMU_VERSION}} \
          --build-arg JOBS={{.QEMU_JOBS}} \
          --output type=local,dest={{.OUTPUT_DIR}} \
          .
      - task: qemu:verify

  qemu:verify:
    desc: Verify the built QEMU is the pinned version and exposes the devices we depend on.
    cmds:
      # Two halves, and they are separated because they need different things to be
      # true. The files are checked where they were extracted; the *behaviour* is
      # checked where the binary can actually run.
      #
      # It was one half until the first CI run this repository ever had, which failed
      # here with `liburing.so.2: cannot open shared object file`. The extracted binary
      # is dynamically linked against the build image's libraries, so executing it on
      # the host works only where those happen to be installed — which is every
      # developer machine that has ever run this, and not a bare GitHub runner.
      # ADR-0025 already decided this for the lane ("the guest lane runs inside the
      # published runtime image, rather than installing QEMU's dynamic dependencies on
      # a bare runner"); the check that guards the lane was the one thing still
      # assuming otherwise.
      - |
        set -euo pipefail
        bin={{.OUTPUT_DIR}}/bin/qemu-system-x86_64
        test -x "$bin" || { echo "missing $bin — run: task build:qemu"; exit 1; }
        test -x {{.OUTPUT_DIR}}/bin/qemu-storage-daemon
        test -f {{.OUTPUT_DIR}}/share/spin-stack/qemu/bios-256k.bin
        # pvh.bin is how -kernel enters a PVH ELF kernel, which is the guest lane's
        # only boot path. Its absence fails at run time as a rom-open error, which
        # reads like a backend bug.
        test -f {{.OUTPUT_DIR}}/share/spin-stack/qemu/pvh.bin || {
          echo "missing pvh.bin — a direct kernel boot (-kernel) cannot work; rebuild with: task build:qemu"; exit 1; }
        echo "OK: the extracted tree carries qemu-system-x86_64, the storage daemon and the firmware (incl. pvh)"
      - task: qemu:verify:behaviour

  qemu:verify:behaviour:
    desc: Run the pinned QEMU and assert its version and devices, wherever that QEMU is actually runnable.
    cmds:
      # The question is "is the QEMU this caller will execute the pinned one, with the
      # device the data path needs" — and the answer has to come from whichever QEMU that
      # is. There are three callers and they are not the same:
      #
      #   - a developer machine, where the extracted binary runs because the libraries it
      #     was linked against happen to be installed;
      #   - CI's guest jobs, which run *inside* the runtime image (ADR-0025) where the
      #     binary is trivially runnable and there is no docker to ask about an image —
      #     this is what broke when the check unconditionally built one: `"docker":
      #     executable file not found in $PATH`, inside a container that had QEMU sitting
      #     right there;
      #   - a bare runner building the artefact for others, where the binary cannot run
      #     at all: `liburing.so.2: cannot open shared object file`.
      #
      # So: run it if it runs, and fall back to the image if it does not. That is not the
      # "detect and hope" this rejected in its first version — the branch taken is printed,
      # so a reader always knows which QEMU answered.
      - |
        set -euo pipefail
        bin={{.OUTPUT_DIR}}/bin/qemu-system-x86_64
        where=""
        if out=$("$bin" --version 2>/dev/null && echo --- && "$bin" -device help 2>&1); then
          where="the binary at $bin"
        else
          img={{.QEMU_IMAGE}}:{{.QEMU_VERSION}}
          echo "$bin cannot run here (its libraries are the build image's) — asking the runtime image instead"
          task build:qemu:image
          out=$(docker run --rm --entrypoint /bin/sh "$img" -c \
            '/usr/local/bin/qemu-system-x86_64 --version; echo ---; /usr/local/bin/qemu-system-x86_64 -device help 2>&1')
          where="$img"
        fi
        printf '%s' "$out" | grep -q '{{.QEMU_VERSION}}' || {
          echo "the QEMU in $where is not the pinned {{.QEMU_VERSION}}:"; printf '%s\n' "$out" | head -3; exit 1; }
        printf '%s' "$out" | grep -q 'vhost-user-blk-pci' || {
          echo "the QEMU in $where has no vhost-user-blk-pci device (§3 data path)"; exit 1; }
        echo "OK: $(printf '%s' "$out" | head -1), vhost-user-blk-pci present — verified in $where"

  build:guest:
    desc: Build the initramfs the QEMU lane boots (a static Go /init). The kernel comes from `task fetch:kernel`.
    sources:
      - integration/guestinit/**/*.go
      - hack/build-guest-initramfs.sh
    generates:
      - '{{.OUTPUT_DIR}}/guest/initramfs.cpio.gz'
    cmds:
      - OUT_DIR={{.OUTPUT_DIR}}/guest bash hack/build-guest-initramfs.sh

  fetch:kernel:
    desc: >-
      Put the pinned guest kernel at _output/guest/vmlinux, from a sibling spinbox
      checkout or from the mirrored image (ADR-0022). Idempotent; storage never builds one.
    env: &guest_kernel_env
      KERNEL: '{{.GUEST_KERNEL}}'
      KERNEL_SHA256: '{{.GUEST_KERNEL_SHA256}}'
      KERNEL_VERSION: '{{.GUEST_KERNEL_VERSION}}'
      SPINBOX_KERNEL: '{{.SPINBOX_KERNEL}}'
      KERNEL_IMAGE: '{{.GUEST_KERNEL_IMAGE}}'
    cmds:
      - bash hack/guest-kernel.sh fetch

  guest:verify:
    desc: Assert the guest lane's inputs — the initramfs we build, and that the kernel is the one we pinned.
    deps: [build:guest, fetch:kernel]
    env: *guest_kernel_env
    cmds:
      # This half was one `test -f`, and `test -f` says OK for a zero-byte file, for a
      # half-written one, and for an archive with no /init — three states whose whole
      # symptom is a kernel panic minutes later inside QEMU, attributed to the lane. Worse,
      # `build:guest` does not rebuild any of them: its `sources:`/`generates:` fingerprint
      # compares the *sources*, so a truncated artefact is "up to date". Verified 2026-08-04
      # by emptying the file: the old target printed OK and exited 0.
      #
      # So the artefact is opened, not stat'ed, and every failure names the task that makes
      # a good one. cpio is required rather than optional for the same reason the kernel's
      # readelf check is: a machine that cannot look must not report OK.
      - |
        set -euo pipefail
        img={{.OUTPUT_DIR}}/guest/initramfs.cpio.gz
        test -f "$img" || { echo "no initramfs at $img — run: task build:guest" >&2; exit 1; }
        command -v cpio >/dev/null || {
          echo "cpio is missing, so $img cannot be inspected (apt-get install cpio)" >&2; exit 1; }
        gzip -t "$img" 2>/dev/null || {
          echo "$img is not a valid gzip stream — a truncated or interrupted build; rebuild: task build:guest" >&2
          exit 1; }
        # ./init is the whole contract with the kernel: it mounts the archive as rootfs and
        # execs /init, and an archive without one panics with "no working init found",
        # which reads like a kernel problem rather than a missing build step.
        # `find . | cpio` stores paths as ./init, and cpio --list prints them back without
        # the ./ — matching only the stored spelling made this fail on a perfectly good
        # archive the first time it ran, which is the crying-wolf failure a preflight can
        # least afford.
        listing=$(gzip -dc "$img" | cpio --list --quiet 2>/dev/null || true)
        grep -qE '^(\./)?init$' <<<"$listing" || {
          echo "$img contains no ./init — the kernel would mount it and panic with no PID 1; rebuild: task build:guest" >&2
          exit 1; }
        echo "OK: $img — gzip cpio carrying ./init"
      - bash hack/guest-kernel.sh verify

  guest:kernel:pin:
    desc: "Print the sha256 of a kernel artefact, for bumping GUEST_KERNEL_SHA256. Usage: task guest:kernel:pin -- <file>"
    env: *guest_kernel_env
    cmds:
      - bash hack/guest-kernel.sh pin {{.CLI_ARGS}}

  guest:kernel:tag:
    desc: >-
      Print the content tag of the pinned guest kernel (sha256-<pin>) — the tag
      `guest:kernel:push` publishes alongside the version. CI resolves the mirror from
      this so no workflow spells the pin out a second time, and the tag is
      content-addressed for the same reason ADR-0022 pins by hash: a tag that can be
      moved is a kernel that can be swapped under a lane that already certified it.
    silent: true
    cmds:
      - echo "sha256-{{.GUEST_KERNEL_SHA256}}"

  guest:kernel:push:
    desc: >-
      Mirror the pinned kernel into a registry so machines with no spinbox checkout can
      run the lane (ADR-0022). Usage:
      task guest:kernel:push GUEST_KERNEL_IMAGE=ghcr.io/<owner>/<repo>/guest-kernel
      Requires a `docker login` to that registry.
    deps: [fetch:kernel]
    cmds:
      - |
        set -euo pipefail
        test -n "{{.GUEST_KERNEL_IMAGE}}" || {
          echo "set GUEST_KERNEL_IMAGE=<registry>/<path>/guest-kernel"; exit 1; }
        # A build context holding exactly the artefact: the image is one file on
        # scratch, so its digest is a hash of the kernel and of nothing else.
        ctx=$(mktemp -d); trap 'rm -rf "$ctx"' EXIT
        cp {{.GUEST_KERNEL}} "$ctx/vmlinux"
        # org.opencontainers.image.source is what links a ghcr.io package to a repository,
        # and the link is what lets that repository's Actions token read it — **but only
        # when Actions is the pusher.** Pushed from a laptop with a personal token, ghcr
        # creates the package owned by the pusher and unlinked, and this label does not
        # link it afterwards: storage/qemu, pushed by the QEMU workflow, came out linked,
        # and storage/guest-kernel, pushed from a developer machine with the same label,
        # did not. So the label is necessary and not sufficient, `guest-inputs` fails with
        # "not published" for a package that exists, and hack/publish-guest-inputs.sh's
        # readable_by_ci is what names the real state and prints where to fix it. Derived from the target path rather than configured,
        # because the only namespace CI resolves is ghcr.io/<owner>/<repo>/...; anything
        # else gets no label rather than a wrong one. Same derivation in build:qemu:push.
        src=""
        case "{{.GUEST_KERNEL_IMAGE}}" in
          ghcr.io/*/*/*) slug={{.GUEST_KERNEL_IMAGE}}; slug=${slug#ghcr.io/}; slug=${slug%/*}
                         src="--label org.opencontainers.image.source=https://github.com/$slug" ;;
        esac
        docker buildx build \
          --file Dockerfile.guest-kernel \
          --target package \
          --platform linux/amd64 \
          $src \
          --tag {{.GUEST_KERNEL_IMAGE}}:{{.GUEST_KERNEL_VERSION}} \
          --tag {{.GUEST_KERNEL_IMAGE}}:sha256-{{.GUEST_KERNEL_SHA256}} \
          --push \
          "$ctx"
        echo
        echo "pull it back with the digest, not the tag:"
        echo "  task fetch:kernel GUEST_KERNEL_IMAGE={{.GUEST_KERNEL_IMAGE}}@\$(docker buildx imagetools inspect --format '{{`{{.Manifest.Digest}}`}}' {{.GUEST_KERNEL_IMAGE}}:{{.GUEST_KERNEL_VERSION}})"

  # The two artefacts CI's guest jobs need and this repository does not build. Publishing
  # them was a procedure spread over four files — this workflow's failure summary, two push
  # targets above, and a track log — and a procedure is what a human gets one step wrong
  # in. `guest:inputs:check` names every input; `guest:inputs:publish` does the whole thing
  # and proves it by resolving both refs the way `.github/workflows/ci.yml` resolves them.
  # The name matches that workflow's `guest-inputs` job on purpose: the job that fails is
  # the job this task exists to unblock.
  guest:inputs:check:
    desc: >-
      Name every input publishing the guest lanes' artefacts needs (gh, a token with
      write:packages, docker, the pinned kernel), and say which are missing. No side effects.
    env: &publish_guest_env
      REPO: '{{.REPO | default ""}}'
      KERNEL: '{{.GUEST_KERNEL}}'
      KERNEL_SHA256: '{{.GUEST_KERNEL_SHA256}}'
      KERNEL_VERSION: '{{.GUEST_KERNEL_VERSION}}'
      SPINBOX_KERNEL: '{{.SPINBOX_KERNEL}}'
      QEMU_VERSION: '{{.QEMU_VERSION}}'
      TASK_EXE: '{{.TASK_EXE}}'
    cmds:
      - bash hack/publish-guest-inputs.sh check

  guest:inputs:publish:
    desc: >-
      Publish both artefacts CI's guest jobs need — the pinned QEMU image (by dispatching
      the QEMU workflow) and the pinned guest kernel — then verify both resolve. Idempotent.
      Usage: task guest:inputs:publish REPO=<owner>/<repo>
    env: *publish_guest_env
    cmds:
      - bash hack/publish-guest-inputs.sh publish

  build:qemu:image:
    desc: Build the QEMU runtime image (used by the integration lane, not extracted).
    cmds:
      - |
        docker buildx build \
          --file Dockerfile.qemu \
          --target runtime \
          --platform linux/amd64 \
          --cache-from {{.QEMU_CACHE_FROM}} \
          --build-arg QEMU_VERSION={{.QEMU_VERSION}} \
          --build-arg JOBS={{.QEMU_JOBS}} \
          --tag {{.QEMU_IMAGE}}:{{.QEMU_VERSION}} \
          --load \
          .

  qemu:version:
    desc: Print the pinned QEMU version (the single source of truth for CI tags).
    silent: true
    cmds:
      - echo "{{.QEMU_VERSION}}"

  build:qemu:push:
    desc: >-
      Build and push the QEMU runtime image. Usage:
      task build:qemu:push QEMU_IMAGE=ghcr.io/<owner>/<repo>/qemu QEMU_IMAGE_EXTRA_TAG=<sha>
      Requires a `docker login` to that registry.
    vars:
      QEMU_IMAGE_EXTRA_TAG: '{{.QEMU_IMAGE_EXTRA_TAG | default ""}}'
    cmds:
      - |
        set -euo pipefail
        # The package→repository link, exactly as at guest:kernel:push and for the same
        # reason: an unlinked private package reads to CI as an unpublished one.
        src=""
        case "{{.QEMU_IMAGE}}" in
          ghcr.io/*/*/*) slug={{.QEMU_IMAGE}}; slug=${slug#ghcr.io/}; slug=${slug%/*}
                         src="--label org.opencontainers.image.source=https://github.com/$slug" ;;
        esac
        docker buildx build \
          --file Dockerfile.qemu \
          --target runtime \
          --platform linux/amd64 \
          --cache-from {{.QEMU_CACHE_FROM}} \
          --cache-to {{.QEMU_CACHE_TO}} \
          --build-arg QEMU_VERSION={{.QEMU_VERSION}} \
          --build-arg JOBS={{.QEMU_JOBS}} \
          $src \
          --tag {{.QEMU_IMAGE}}:{{.QEMU_VERSION}} \
          {{if .QEMU_IMAGE_EXTRA_TAG}}--tag {{.QEMU_IMAGE}}:{{.QEMU_IMAGE_EXTRA_TAG}} \{{end}}
          --push \
          .

  backend:conformance:
    desc: "§6.1/§25.4 object-store conformance suite against the pinned backend image (blocking per backend version)."
    cmds:
      - RUSTFS_IMAGE={{.RUSTFS_IMAGE}} go test -tags integration -count=1 -v ./integration/backend/...

  # --- build / test / lint ----------------------------------------------------

  build:
    desc: Build all packages and commands.
    cmds:
      - go build ./...

  build:cmd:
    desc: Build the binaries (volume-agent, control-plane) into _output/bin.
    vars:
      # The version each binary reports about itself: the Agent sends it in every
      # heartbeat (§13.4, fleet-mixed), so "dev" from an untagged build is a
      # deliberate answer, not a missing one.
      VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}/bin
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.OUTPUT_DIR}}/bin/ ./cmd/...

  test:
    desc: Run the full unit/property test suite with the race detector.
    cmds:
      - go test -race ./...

  test:integration:
    desc: Run Docker-gated integration tests (TestContainers Postgres).
    vars:
      REQUIRE_PROOFS: '{{.REQUIRE_PROOFS | default ""}}'
    cmds:
      - go test -tags integration -count=1 ./internal/metadata/pg/...
      - task: test:integration:qemu
        vars: { REQUIRE_PROOFS: '{{.REQUIRE_PROOFS}}' }

  test:e2e:
    desc: >-
      Run the deployment, not the library: the real control-plane and volume-agent
      as processes, against a real Postgres 18 and the pinned RustFS. It is the only
      lane that can see the two binaries disagree — about a key file, about a flag
      nobody passes — because everything else drives Go types in-process. Two of its
      scenarios boot a real guest; with REQUIRE_PROOFS=1 they may not skip.
    deps: [build:cmd]
    vars:
      REQUIRE_PROOFS: '{{.REQUIRE_PROOFS | default ""}}'
    env: &proofs_env
      # One knob, not two. The preflights below resolve _output through OUTPUT_DIR and
      # the tests resolve it through QEMU_OUTPUT_DIR, so a lane could verify one
      # directory and boot out of another. Exporting one from the other makes that
      # impossible and gives CI a single variable to point at the runtime image's layout.
      QEMU_OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      SPIN_REQUIRE_PROOFS: '{{.REQUIRE_PROOFS}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.REQUIRE_PROOFS}}" ]; then {{.TASK_EXE}} guest:ready OUTPUT_DIR={{.OUTPUT_DIR}}; fi
      - RUSTFS_IMAGE={{.RUSTFS_IMAGE}} go test -tags e2e -count=1 -timeout 15m ./integration/e2e/...

  test:integration:qemu:
    desc: >-
      Boot a real QEMU {{.QEMU_VERSION}} guest against the vhost-user-blk backend
      (Phase 03, increment 3.1; the [Verify] step of RISK-10). Skips with a pointer to
      `task build:qemu` if the pinned QEMU has not been built — unless REQUIRE_PROOFS=1,
      which is what the merge gate passes.
    vars:
      REQUIRE_PROOFS: '{{.REQUIRE_PROOFS | default ""}}'
    env: *proofs_env
    cmds:
      # Without REQUIRE_PROOFS the Go tests skip themselves when _output has no QEMU, so
      # this task must not hard-fail there — `deps: [qemu:verify]` used to, which made
      # `task test:integration` unrunnable anywhere QEMU had not been built by hand. When
      # it *is* built, verifying it is still mandatory: a QEMU that is present but not the
      # pinned one is the failure this lane exists to notice.
      - |
        set -euo pipefail
        # OUTPUT_DIR is forwarded explicitly: {{.TASK_EXE}} starts a *new* task process,
        # which does not inherit a var overridden on this one's command line — so without
        # it the preflight would certify _output while the tests booted out of somewhere
        # else, which is the exact class of lie this whole section is about.
        if [ -n "{{.REQUIRE_PROOFS}}" ]; then
          {{.TASK_EXE}} guest:ready OUTPUT_DIR={{.OUTPUT_DIR}}
        elif [ -x {{.OUTPUT_DIR}}/bin/qemu-system-x86_64 ]; then
          {{.TASK_EXE}} qemu:verify OUTPUT_DIR={{.OUTPUT_DIR}}
        else
          echo "SKIP: no QEMU in {{.OUTPUT_DIR}} — the lane's tests will skip themselves."
          echo "      to run them for real: task build:qemu (or pull the published image)"
        fi
      # -count=1 because the result depends on a binary outside the module: a
      # cached PASS would survive a QEMU rebuild, which is the one thing this
      # lane exists to notice.
      - go test -tags integration -count=1 -timeout 15m ./integration/vhost/...

  guest:ready:
    desc: >-
      Assert every input a guest-backed proof needs is present and is the one we pinned:
      the QEMU, the kernel and the initramfs. Run before the lanes rather than inside
      them, so "this machine has no QEMU" is answered in seconds instead of forty
      minutes into the gate.
    cmds:
      - task: qemu:verify
      - task: guest:verify

  # `guest:proofs` was here: the two guest-backed lanes with skipping disabled, described
  # as "what CI's guest jobs run". Deleted 2026-08-05 because that sentence was false and
  # nothing called it. CI cannot run both lanes in one job — a hosted runner has the
  # pinned QEMU or a Docker daemon, not both (ADR-0025) — so `.github/workflows/ci.yml`
  # invokes `test:integration:qemu` and `test:e2e` in two separate container jobs, each
  # with REQUIRE_PROOFS=1, and neither ever named this target. A target that describes
  # itself as the thing CI runs, that CI does not run, is the same defect as a gate that
  # reports success for a proof it skipped, one level down: it is read, believed, and
  # wrong. On one machine `task ci:full` already runs both lanes and is the honest name
  # for that claim.

  vhost:bootsector:
    desc: >-
      Reassemble integration/vhost/testdata/bootsector.bin from its .S source.
      Needs binutils (as + ld); the .bin is committed so the integration lane
      does not.
    cmds:
      - |
        set -euo pipefail
        dir={{.ROOT_DIR}}/integration/vhost/testdata
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        as --32 -o "$tmp/boot.o" "$dir/bootsector.S"
        ld -m elf_i386 -Ttext 0x7c00 --oformat binary -o "$tmp/boot.bin" "$tmp/boot.o"
        test "$(stat -c%s "$tmp/boot.bin")" = 512 || { echo "boot sector is not 512 bytes"; exit 1; }
        mv "$tmp/boot.bin" "$dir/bootsector.bin"
        echo "rebuilt $dir/bootsector.bin"

  cover:
    desc: Cross-package coverage report; enforces a 90% floor on production code.
    cmds:
      - bash hack/coverage.sh

  deadcode:
    desc: >-
      Fail on a function no binary reaches that neither hack/deadcode-allow.txt nor
      hack/deadcode-pending.txt accounts for (CLAUDE.md: "a component with no caller is a
      liability, not progress"). In `ci`.
    # It is in `ci` since 2026-08-06, and what it took to get there was a second list.
    #
    # It was deliberately out of every gate before that, with the reason written down: it
    # exited 1 on findings nobody had decided about, and a step that is red the day it
    # lands is a step someone deletes. Waiting for that count to reach zero was the plan,
    # and it was the wrong plan — the count drifts on its own as other lanes delete code
    # (it has already fallen once, with nobody deciding anything), so "wait until it is
    # zero" is a gate that arrives by accident if it arrives at all, and until it does,
    # every newly unreachable symbol lands unnoticed.
    #
    # The mechanism is a ratchet over a *set*, not a count: hack/deadcode-pending.txt pins
    # the findings that are still owed a decision, each with its owner, and the script
    # fails on a finding in neither list (the set cannot grow), on an entry that is no
    # longer reported (it cannot outlive its code), and on a symbol claimed by both lists.
    # A pinned integer was rejected for the reason this repository already knows: the one
    # ratchet here that pins a bare number, `wantBehavioural`, is the one that causes merge
    # conflicts, and a number can be satisfied by deleting one finding and adding another.
    #
    # Rejected alternative: move the ten into hack/deadcode-allow.txt with a reason each
    # and have one list. That is green today and costs the allowlist its meaning — it is
    # the file that says which unreachable symbols are *correct*, and half its entries
    # would then be ones that are not.
    #
    # In `ci` rather than only `ci:full`, next to lint: it needs no Docker, it costs ~2s,
    # and the person who creates an unreachable symbol is running `task ci`.
    deps: [tools:deadcode]
    cmds:
      - DEADCODE={{.TOOLS_BIN}}/deadcode bash hack/deadcode.sh

  dev:entries:
    desc: >-
      List the open DEV entries in STATUS.md and who owes each decision, and fail on one
      that hack/dev-entries-open.txt does not pin (CLAUDE.md's gate: "No open DEV entry
      that this increment introduced"). In `ci`.
    # The gate's fourth line had no mechanism at all: no target, no script and no CI job
    # read a DEV entry, so `task ci:full` was green over an open one by construction.
    # Wave 6 demonstrated it — DEV-0024 was opened and the increment shipped green — and
    # the entry recording that in STATUS.md is what this target answers.
    #
    # Rejected: fail whenever any entry is open, which is the literal reading of the gate.
    # Two of the three open entries wait on decisions a human has not made, so that
    # version is red on the day it lands, and a step that is red on the day it lands is a
    # step someone deletes — written down twelve lines above as the reason `deadcode`
    # stayed out of every gate for two waves.
    #
    # Rejected: list and never fail. It cannot produce a false red and it is also easy to
    # never run; `backend:conformance` was broken on main for a whole increment for
    # exactly that reason.
    #
    # What it does instead is `deadcode`'s ratchet over a *set*: the open entries are
    # pinned with a reason each, an entry appearing that nothing pinned is red, and a pin
    # that outlives its entry is red. Opening a DEV entry stays possible and stops being
    # free. The "a parser over Markdown fires on prose" objection is answered by parsing
    # only heading lines that name a DEV-NNNN id — the one edit that can move this check
    # is the one it exists to notice.
    #
    # In `ci` rather than only `ci:full`, beside deadcode: it reads two files, costs
    # milliseconds, needs no toolchain, and the person opening a DEV entry is running
    # `task ci`.
    cmds:
      - bash hack/dev-entries.sh

  lint:
    desc: Run golangci-lint plus the custom simulable analyzer (§25.1/INV-01).
    cmds:
      - task: lint:golangci
      - task: lint:simulable
      - task: lint:proto

  lint:golangci:
    desc: Run golangci-lint (incl. forbidigo/depguard belt-and-suspenders).
    deps: [tools:golangci]
    cmds:
      # The build tags matter: without them golangci-lint never parses a single file
      # under `integration/` or `internal/testinfra`, so the entire integration and
      # e2e surface was unlinted — including the lanes that drive QEMU and Postgres.
      # Found 2026-08-02, when the e2e lane's own files turned out to be invisible to
      # the gate that was supposed to check them.
      - "{{.TOOLS_BIN}}/golangci-lint run --build-tags integration,e2e ./..."

  lint:simulable:
    desc: Run the authoritative simulable-interfaces analyzer over all packages.
    cmds:
      # Same build tags as lint:golangci, for the same reason (DEV-0016) and one
      # step later. Without them the analyzer's package loader never parses a file
      # under `integration/` or `internal/testinfra` — so INV-01's *authoritative*
      # layer was checking a smaller tree than its belt-and-suspenders layer, and
      # the surface where a real clock, a real socket and a real process meet our
      # code was governed only by golangci-lint's exclusion list.
      #
      # `-tags` on the analyzer binary is deprecated and does nothing; the flag that
      # reaches go/packages' `go list` child is GOFLAGS, which is why the tags are
      # set as environment and not as an argument.
      - GOFLAGS=-tags=integration,e2e go run {{.SIMULABLE}} ./...

  dst:
    desc: Run the mandatory Deterministic Simulation Testing scenario set (§25.1, §25.2).
    cmds:
      # No `-run` filter, deliberately. `go test -run <regex>` exits 0 and prints
      # "[no tests to run]" when the regex matches nothing, so the test names this
      # target used to list were a silent single point of failure: rename one, mistype
      # one, and the mandatory gate reports success having proven nothing. That is the
      # same class of defect as a checker that cannot fire, which this repository has
      # already paid for twice.
      #
      # The obvious fix was a preflight asserting that each alternative selects at least
      # one test (`go test -list`). Rejected: it writes the same test names down a second
      # time, so it rots in exactly the situation it exists to catch — and in
      # ./internal/dst it does not even work. That package's TestMain audits, after
      # m.Run(), that every default checker was shown to catch a planted bug, and it
      # skips that audit whenever `test.run` is non-empty; `-list` leaves `test.run`
      # empty while running no tests, so `go test -list` there exits 1 on its own.
      #
      # Naming nothing beats naming things twice: with no filter there is no selection
      # to go stale, and what the gate proves is the whole package. It also switches the
      # TestMain audit back on here — for as long as this target filtered, the one check
      # that proves the checkers can fire never executed in the gate that exists to run
      # them. Measured cost of running both packages whole rather than filtered: 0.02s.
      # `-count=1` stays: a cached "ok" is the other way a gate reports success without
      # running.
      - go test -race -count=1 ./internal/dst/
      - go test -race -count=1 ./internal/wal/

  fmt:
    desc: Format code with the pinned golangci-lint formatters (gofmt + goimports).
    deps: [tools:golangci]
    cmds:
      - "{{.TOOLS_BIN}}/golangci-lint fmt ./..."

  fmt:check:
    desc: Fail if any file is unformatted (what CI enforces, before the slower linters).
    deps: [tools:golangci]
    cmds:
      - "{{.TOOLS_BIN}}/golangci-lint fmt --diff ./..."

  workflows:verify:
    desc: >-
      Assert every `task <name>` in .github/workflows resolves against this Taskfile.
      No workflow here has ever executed, so this is the only thing that checks them.
    cmds:
      - TASK_EXE={{.TASK_EXE}} bash hack/workflow-tasks.sh

  ci:
    desc: Fast local gate — format, build, lint, deadcode, open DEV entries, test, dst. No Docker required.
    cmds:
      - task: fmt:check
      - task: build
      - task: lint
      # Beside lint, and before the race suite: it is static analysis over the built
      # program, it costs about two seconds, and an unreachable symbol reported after
      # twenty seconds of tests is a report that arrives once nobody is watching.
      - task: deadcode
      # Beside deadcode because it is the same kind of claim — a rule CLAUDE.md states as
      # part of "done" that nothing computed — and because it is the cheapest step here:
      # two files read, no toolchain, no build. Its list of open entries is printed on a
      # green run on purpose, so the divergences this tree ships with are read by whoever
      # runs the gate rather than by whoever remembers to open STATUS.md.
      - task: dev:entries
      - task: test
      - task: dst
      # Half a second, and it is in the *fast* gate rather than only in `ci:full`
      # because renaming a Taskfile target is a local edit whose only victim is a
      # workflow file — and the person renaming it runs `task ci`, not `task ci:full`.
      # The alternative, leaving it to CI, means the report arrives from the one runner
      # that cannot answer it: the guest jobs fail on a missing target long before they
      # reach the proof they exist for, and their logs read like an infrastructure fault.
      - task: workflows:verify

  # --- the merge gate ----------------------------------------------------------
  #
  # `ci:full` and `ci:noguest` are the same list of lanes making two different claims,
  # and the difference between them is the whole point of this section.
  #
  # What was wrong: `test:integration:qemu` printed `SKIP: no QEMU in _output` and exited
  # 0, and the tests under it skipped themselves for the same reason — so `task ci:full`
  # reported success on a machine that had booted no guest, which is every machine except
  # one laptop. The guest-backed lanes are where a real Linux kernel exercises this system
  # and they carry the headline proof of every recent wave; the gate's exit code said they
  # had run.
  #
  # The mechanism: the *caller* declares what it is claiming (REQUIRE_PROOFS), the lanes
  # pass it to the tests as SPIN_REQUIRE_PROOFS, and `internal/testinfra` turns each
  # "input not built" skip into a failure under it. A skip cannot then be mistaken for a
  # pass, because under the gate there is no skip.
  #
  # Alternatives rejected, and why:
  #
  #   - **Make the skip loud and leave the exit code alone.** It already was loud: the SKIP
  #     line quoted above is printed in capitals with the remedy underneath, and it changed
  #     nothing, because a gate is read by its exit code. In CI nobody reads the log of a
  #     green run at all.
  #   - **A machine-readable summary of what was skipped, checked at the end of the gate.**
  #     That is a second record of what ran, maintained beside the thing that runs it, and
  #     the two go out of step exactly when a lane is added — which is the same defect one
  #     level up. It also cannot see a test that skipped for a reason the summary's author
  #     did not anticipate.
  #   - **An opt-out environment variable (ALLOW_SKIPPED_PROOFS=1) on a single `ci:full`.**
  #     Rejected because an environment variable is invisible in the sentence people
  #     actually exchange — "ci:full was green". A second *target name* is not: nobody can
  #     paste "ci:noguest passed" and have it read as the merge gate, and CI cannot inherit
  #     it from a shell profile by accident.
  #   - **Delete the skips outright, so the lanes always fail without QEMU.** That is a red
  #     build meaning "you have not run task build:qemu" — the failure mode ADR-0025 named,
  #     and the fastest way to teach people to ignore red. `task ci` (no Docker, no QEMU)
  #     and `task ci:noguest` (Docker, no QEMU) are what keep a partial machine usable.

  ci:full:
    desc: >-
      The merge gate: everything, including the proofs that need a real guest. Fails
      rather than skips when the pinned QEMU or the pinned kernel is absent. `task ci` is
      the fast local loop; `task ci:noguest` is this same list minus the guest-backed
      proofs, for a machine that cannot build QEMU.
    cmds:
      # First, not last. Everything below takes twenty minutes to reach the guest lanes,
      # and "this machine has no QEMU" is an answer that should cost a fraction of a
      # second — measured at 0.026s. The failure is wrapped rather than left to
      # qemu:verify because the one thing the reader needs to know here is the *other*
      # target, and qemu:verify is called from places where that advice would be wrong.
      - |
        set -euo pipefail
        if ! {{.TASK_EXE}} guest:ready OUTPUT_DIR={{.OUTPUT_DIR}}; then
          cat >&2 <<'EOF'

        ci:full cannot run: this machine is missing an input the guest-backed proofs need
        (named above). It does not skip them — that is what made the gate green on
        machines that had booted no guest.

          task build:qemu && task fetch:kernel   # then: task ci:full
          task ci:noguest                        # everything else, and it says what it did not prove
        EOF
          exit 1
        fi
      - task: ci:lanes
        vars: { REQUIRE_PROOFS: "1" }

  ci:noguest:
    desc: >-
      `ci:full` minus every proof that needs a real guest — for a machine that cannot
      build QEMU, and for CI's non-guest job. It is NOT the merge gate, and its name and
      its last line of output both say so.
    cmds:
      - task: ci:lanes
        vars: { REQUIRE_PROOFS: "" }
      # The disclosure. It is the last thing on the terminal precisely because the thing
      # above it just printed a wall of "ok".
      - |
        cat <<'EOF'

        ===============================================================================
        ci:noguest PASSED — and it is not the merge gate.
        NOT PROVEN: every claim that needs a real Linux kernel in the loop — the whole of
        integration/vhost, and the scenarios in integration/e2e that boot a guest. That
        is where INV-18 (a guest's fsync puts zero objects in the bucket) is established.
        For the real gate: task build:qemu && task fetch:kernel && task ci:full
        ===============================================================================
        EOF

  ci:lanes:
    internal: true
    desc: >-
      The one list of lanes both public gates run, so that adding a lane cannot reach one
      of them and miss the other. The Docker-gated tasks live in it because a task nobody
      runs is a task nobody notices going red: backend:conformance was broken on main for
      a whole increment because it was documented but not gated.
    cmds:
      - task: ci
      - task: generate:check
      - task: db:verify
      - task: cover
      - task: test:integration
        vars: { REQUIRE_PROOFS: '{{.REQUIRE_PROOFS}}' }
      - task: backend:conformance
      - task: test:e2e
        vars: { REQUIRE_PROOFS: '{{.REQUIRE_PROOFS}}' }
