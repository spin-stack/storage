version: "3"

# Build/test/lint/dst orchestration for github.com/spin-stack/storage; `ci` is the
# aggregate gate GitHub Actions runs.
#
# Reproducibility rule: every tool is pinned here and installed into ./.tools/bin by
# `task tools`, so nothing depends on what is on the developer's PATH.

vars:
  SIMULABLE: ./hack/analyzers/simulable/cmd/simulable
  # Project-local tool bin. Committed to .gitignore; rebuilt by `task tools`.
  TOOLS_BIN: "{{.ROOT_DIR}}/.tools/bin"
  OUTPUT_DIR: "{{.ROOT_DIR}}/_output"
  # Project-local by default so no task needs root; override for a shared CI cache.
  BUILDKIT_CACHE_DIR: '{{.BUILDKIT_CACHE_DIR | default (printf "%s/.cache/buildkit" .ROOT_DIR)}}'
  BUILDKIT_CACHE_QEMU: '{{.BUILDKIT_CACHE_DIR}}/storage-qemu'
  # QEMU is pinned here and in CLAUDE.md; the same version runs in CI and prod.
  QEMU_VERSION: 11.1.1
  QEMU_JOBS: '{{.QEMU_JOBS | default 8}}'
  # BuildKit cache backends. Local by default (a laptop); CI overrides them with
  # `type=gha` so the build is not duplicated in a workflow file — the Dockerfile and
  # the flags stay in one place, which is the rule the whole Taskfile exists for.
  QEMU_CACHE_FROM: '{{.QEMU_CACHE_FROM | default (printf "type=local,src=%s" .BUILDKIT_CACHE_QEMU)}}'
  QEMU_CACHE_TO: '{{.QEMU_CACHE_TO | default (printf "type=local,dest=%s,mode=max,compression=zstd" .BUILDKIT_CACHE_QEMU)}}'
  # Where the runtime image is published. Overridden in CI with the GitHub Packages
  # path; the default is a local tag so `task build:qemu:image` needs no registry.
  QEMU_IMAGE: '{{.QEMU_IMAGE | default "spin-stack/storage-qemu"}}'
  # Object-store backend under test (§6.1 conformance suite). Pinned by digest so a
  # re-tagged image cannot silently change what the suite certified.
  RUSTFS_IMAGE: "rustfs/rustfs:latest@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c"
  # Graphviz, pinned by digest like every other image here. The diagrams at the repository
  # root are generated from the .dot beside each one; the SVG is output and is committed so
  # that reading the repository does not require rendering it.
  DOT_IMAGE: "nshine/dot@sha256:17ba91db2197ae4154cdc4b397a263017ce15c7f2c0cb8bf29404d78bcb4bd6d"
  # --- pinned tool versions (the single place each is declared) ---
  SQLC_VERSION: v1.30.0
  PGSCHEMA_VERSION: v1.12.0
  # Postgres for every schema task. The same tag the integration lane starts with
  # TestContainers, so `task db:plan` and the tests can never disagree about what
  # the server accepts.
  POSTGRES_IMAGE: postgres:18-alpine
  DEVDB_CONTAINER: spin-storage-devdb
  DEVDB_PORT: '{{.DEVDB_PORT | default "55432"}}'
  # --- the guest kernel (ADR-0021, ADR-0022) ---
  # storage does not build a kernel: it consumes spinbox's artefact, never its code.
  # The lane reads it from ONE canonical path, and `task fetch:kernel` puts it there
  # from whichever source is available. Nothing else resolves a kernel path.
  GUEST_KERNEL: '{{.OUTPUT_DIR}}/guest/vmlinux'
  # Pinned by content, the same rule as RUSTFS_IMAGE: "which kernel did the lane
  # certify" has to have an answer that is not "whatever was in _output that day".
  # Bump deliberately with `task guest:kernel:pin` and say in the commit why it moved.
  GUEST_KERNEL_VERSION: 7.2.1
  GUEST_KERNEL_SHA256: bd0ff2ed66f1837d1f7d26251c61b300d43810c8a320cfc02fd62179821a5c29
  # Source 1: a sibling spinbox checkout that has already built one (no network).
  SPINBOX_KERNEL: '{{.SPINBOX_KERNEL | default "../spinbox/_output/spinbox-kernel-x86_64"}}'
  # Source 2: the mirror. Unset by default — nothing is published yet — so the failure
  # of `task fetch:kernel` on a machine with no spinbox checkout names it as missing
  # rather than pointing at a registry path that answers 404.
  GUEST_KERNEL_IMAGE: '{{.GUEST_KERNEL_IMAGE | default ""}}'
  # Target database for db:plan / db:apply — the local development database by
  # default. Point DB_* at a real one to plan or apply against it; the password
  # comes from the environment (PGPASSWORD), never from a var in this file.
  DB_HOST: '{{.DB_HOST | default "localhost"}}'
  DB_PORT: '{{.DB_PORT | default .DEVDB_PORT}}'
  DB_NAME: '{{.DB_NAME | default "cp"}}'
  DB_USER: '{{.DB_USER | default "cp"}}'
  # Flags for the database being changed.
  PGSCHEMA_TARGET: --host {{.DB_HOST}} --port {{.DB_PORT}} --db {{.DB_NAME}} --user {{.DB_USER}} --sslmode disable
  # Flags for the scratch database pgschema materializes the desired state in while
  # diffing. Always given explicitly: with no --plan-host, pgschema downloads and
  # runs an embedded PostgreSQL of its own choosing at plan time — unpinned, and not
  # the version this project targets.
  PGSCHEMA_PLAN: --plan-host {{.DB_HOST}} --plan-port {{.DB_PORT}} --plan-db {{.DB_NAME}} --plan-user {{.DB_USER}} --plan-sslmode disable
  # Protobuf/Connect toolchain (ADR-0018). protoc itself is never used: buf
  # compiles the schema and drives the two plugins. PROTOC_GEN_GO_VERSION must
  # match the google.golang.org/protobuf version in go.mod, and
  # PROTOC_GEN_CONNECT_GO_VERSION the connectrpc.com/connect one — a plugin
  # newer than its runtime generates code the module cannot compile.
  BUF_VERSION: v1.72.0
  PROTOC_GEN_GO_VERSION: v1.36.11
  PROTOC_GEN_CONNECT_GO_VERSION: v1.20.0
  # golangci-lint v2 also owns formatting (gofmt + goimports are configured as
  # `formatters` in .golangci.yml), so there is exactly one formatter binary.
  GOLANGCI_VERSION: v2.12.2
  # `deadcode` ships in golang.org/x/tools, which this module already requires (the
  # simulable analyzer is built on go/analysis). It is pinned to the *same* version as
  # go.mod's, and `tools:deadcode` refuses to install when the two disagree: an analyzer
  # built against a different x/tools than the tree compiles with answers about a
  # different program than the one this repository ships.
  XTOOLS_VERSION: v0.43.0

tasks:
  default:
    cmds:
      - task: ci

  # --- tools -----------------------------------------------------------------

  tools:
    desc: Install every pinned tool into ./.tools/bin (sqlc, pgschema, golangci-lint, buf + proto plugins).
    cmds:
      - task: tools:sqlc
      - task: tools:pgschema
      - task: tools:golangci
      - task: tools:buf
      - task: tools:protoc-plugins
      - task: tools:deadcode

  tools:sqlc:
    desc: Install the pinned sqlc.
    status:
      - test -x {{.TOOLS_BIN}}/sqlc && {{.TOOLS_BIN}}/sqlc version | grep -q '{{.SQLC_VERSION}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}

  tools:pgschema:
    desc: Install the pinned pgschema (ADR-0019) — the schema tool.
    # Built from source at an exact tag rather than downloading a release binary:
    # the module proxy and go.sum give the same reproducibility a published
    # checksum would, through the toolchain every other tool here already uses.
    status:
      - test -x {{.TOOLS_BIN}}/pgschema && {{.TOOLS_BIN}}/pgschema --help | grep -q '{{.PGSCHEMA_VERSION | trimPrefix "v"}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install github.com/pgplex/pgschema@{{.PGSCHEMA_VERSION}}

  tools:golangci:
    desc: Install the pinned golangci-lint v2.
    status:
      - test -x {{.TOOLS_BIN}}/golangci-lint && {{.TOOLS_BIN}}/golangci-lint version | grep -q '{{.GOLANGCI_VERSION | trimPrefix "v"}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}

  tools:buf:
    desc: Install the pinned buf (ADR-0018) — the only protobuf compiler this project uses.
    status:
      - test -x {{.TOOLS_BIN}}/buf && {{.TOOLS_BIN}}/buf --version | grep -q '{{.BUF_VERSION | trimPrefix "v"}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}

  tools:protoc-plugins:
    desc: Install the pinned protoc-gen-go and protoc-gen-connect-go (ADR-0018).
    status:
      - test -x {{.TOOLS_BIN}}/protoc-gen-go && {{.TOOLS_BIN}}/protoc-gen-go --version | grep -q '{{.PROTOC_GEN_GO_VERSION}}'
      - test -x {{.TOOLS_BIN}}/protoc-gen-connect-go && {{.TOOLS_BIN}}/protoc-gen-connect-go --version | grep -q '{{.PROTOC_GEN_CONNECT_GO_VERSION | trimPrefix "v"}}'
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - GOBIN={{.TOOLS_BIN}} go install connectrpc.com/connect/cmd/protoc-gen-connect-go@{{.PROTOC_GEN_CONNECT_GO_VERSION}}

  tools:deadcode:
    desc: Install the pinned golang.org/x/tools/cmd/deadcode (the `deadcode` task's analyzer).
    # The status reads the version out of the built binary rather than trusting the file
    # exists: `go version -m` prints the module the binary was built from, so a stale
    # .tools/bin from an older pin reinstalls instead of silently reporting on the wrong
    # analysis.
    status:
      - test -x {{.TOOLS_BIN}}/deadcode && go version -m {{.TOOLS_BIN}}/deadcode | grep -qE 'mod[[:space:]]+golang.org/x/tools[[:space:]]+{{.XTOOLS_VERSION}}'
    preconditions:
      - sh: grep -q 'golang.org/x/tools {{.XTOOLS_VERSION}}$' go.mod
        msg: "XTOOLS_VERSION ({{.XTOOLS_VERSION}}) is not the golang.org/x/tools in go.mod — bump both together."
    cmds:
      - GOBIN={{.TOOLS_BIN}} go install golang.org/x/tools/cmd/deadcode@{{.XTOOLS_VERSION}}

  # --- code generation and migrations ----------------------------------------

  generate:
    desc: Regenerate every committed generated artifact (sqlc + protobuf/Connect).
    cmds:
      - task: generate:sqlc
      - task: generate:proto

  generate:check:
    desc: Fail if any committed generated output is stale.
    cmds:
      - task: generate:sqlc:check
      - task: generate:proto:check

  generate:sqlc:
    desc: Regenerate sqlc code from schema + queries.
    deps: [tools:sqlc]
    cmds:
      - "{{.TOOLS_BIN}}/sqlc generate"

  generate:sqlc:check:
    desc: Fail if the committed sqlc output is stale (generate produced a diff).
    deps: [tools:sqlc]
    cmds:
      - "{{.TOOLS_BIN}}/sqlc generate"
      # Only the generated files: hand-written tests living in internal/db must not
      # make this fail (it is about staleness, not about uncommitted work).
      - git diff --exit-code -- 'internal/db/*.go' ':!internal/db/*_test.go'

  generate:proto:
    desc: Regenerate the protobuf + Connect stubs in api/gen (ADR-0018).
    deps: [tools:buf, tools:protoc-plugins]
    dir: api
    cmds:
      - "{{.TOOLS_BIN}}/buf generate"

  generate:proto:check:
    desc: Fail if the committed protobuf/Connect output is stale.
    deps: [tools:buf, tools:protoc-plugins]
    cmds:
      - task: generate:proto
      - git diff --exit-code -- api/gen

  lint:proto:
    desc: Lint and format-check the protobuf schema (buf STANDARD).
    deps: [tools:buf]
    dir: api
    cmds:
      - "{{.TOOLS_BIN}}/buf lint"
      - "{{.TOOLS_BIN}}/buf format --diff --exit-code"

  # --- schema (pgschema, ADR-0019) --------------------------------------------
  #
  # schema.sql is the declared state; pgschema computes the DDL that takes a live database
  # there. There is no history table, so the reviewable record is the plan: `db:plan`
  # writes one into migrations/ and `db:apply` executes *that file* — reviewing plan A and
  # applying a recomputed plan B is the failure a state-based tool invites; pgschema
  # refuses a saved plan if the database has moved since it was computed. migrations/ is a
  # record, not a replay path: `db:verify` rebuilds from schema.sql alone. Each change
  # leaves a pair — `<ts>_<name>.sql` for review, `<ts>_<name>.json` for apply.

  db:dev:up:
    desc: Start (or reuse) the local Postgres 18 development database that db:plan diffs against.
    cmds:
      - POSTGRES_IMAGE={{.POSTGRES_IMAGE}} DEVDB_CONTAINER={{.DEVDB_CONTAINER}} DEVDB_PORT={{.DEVDB_PORT}} bash hack/db.sh up

  db:dev:down:
    desc: Remove the local development database.
    cmds:
      - DEVDB_CONTAINER={{.DEVDB_CONTAINER}} POSTGRES_IMAGE={{.POSTGRES_IMAGE}} bash hack/db.sh down

  # Standing a *new* database up is not a plan, and this is the only task that does it:
  # db:plan/db:apply diff against a database that already exists. It refuses a non-empty
  # database — see hack/db.sh for why that gate keeps this out of db:plan's review.
  db:init:
    desc: "Apply schema.sql to an EMPTY database — the supported way to stand a new one up. Usage: task db:init [DB_NAME=... DB_HOST=... DB_PORT=... DB_USER=...]"
    deps: [tools:pgschema, db:dev:up]
    cmds:
      - >-
        PGSCHEMA={{.TOOLS_BIN}}/pgschema POSTGRES_IMAGE={{.POSTGRES_IMAGE}}
        TARGET_HOST={{.DB_HOST}} TARGET_PORT={{.DB_PORT}} TARGET_DB={{.DB_NAME}} TARGET_USER={{.DB_USER}}
        bash hack/db.sh init

  db:plan:
    desc: "Plan schema.sql against the development database; commit the result under migrations/. Usage: task db:plan -- <name>"
    deps: [tools:pgschema, db:dev:up]
    cmds:
      - |
        set -euo pipefail
        name='{{.CLI_ARGS}}'
        test -n "$name" || { echo "usage: task db:plan -- <name>   (e.g. task db:plan -- revocation_window)"; exit 1; }
        out="migrations/$(date -u +%Y%m%d%H%M%S)_${name}"
        export PGPASSWORD="${PGPASSWORD:-cp}" PGSCHEMA_PLAN_PASSWORD="${PGSCHEMA_PLAN_PASSWORD:-$PGPASSWORD}"
        {{.TOOLS_BIN}}/pgschema plan {{.PGSCHEMA_TARGET}} {{.PGSCHEMA_PLAN}} \
          --file internal/schema/schema.sql --no-color \
          --output-human stdout --output-sql "$out.sql" --output-json "$out.json"
        if ! grep -q '[^[:space:]]' "$out.sql"; then
          rm -f "$out.sql" "$out.json"
          echo "nothing to plan: the database already matches internal/schema/schema.sql"
          exit 0
        fi
        echo
        echo "wrote $out.sql (review this) and $out.json (what db:apply executes)"

  db:apply:
    desc: "Apply a saved plan — never a recomputed one. Usage: task db:apply PLAN=migrations/<file>.json"
    deps: [tools:pgschema]
    cmds:
      - |
        set -euo pipefail
        plan='{{.PLAN}}'
        test -n "$plan" || { echo "usage: task db:apply PLAN=migrations/<timestamp>_<name>.json"; exit 1; }
        export PGPASSWORD="${PGPASSWORD:-cp}"
        {{.TOOLS_BIN}}/pgschema apply {{.PGSCHEMA_TARGET}} --plan "$plan" {{if .AUTO_APPROVE}}--auto-approve{{end}}

  # Runs db:init's code path against a throwaway empty database, so the newcomer's
  # command is the one the merge gate exercises rather than a second applier nothing runs.
  db:verify:
    desc: Run db:init against an empty Postgres 18 and assert a plan against the result has nothing to do (replaces atlas.sum).
    deps: [tools:pgschema]
    cmds:
      - PGSCHEMA={{.TOOLS_BIN}}/pgschema POSTGRES_IMAGE={{.POSTGRES_IMAGE}} bash hack/db.sh verify

  # --- infrastructure (QEMU, object-store backend) ----------------------------

  build:qemu:
    desc: "Build the pinned QEMU (vhost-user-blk + storage daemon) into _output/ (§3, Phases 02/03)."
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - |
        docker buildx build \
          --file Dockerfile.qemu \
          --target extract \
          --platform linux/amd64 \
          --cache-from {{.QEMU_CACHE_FROM}} \
          --cache-to {{.QEMU_CACHE_TO}} \
          --build-arg QEMU_VERSION={{.QEMU_VERSION}} \
          --build-arg JOBS={{.QEMU_JOBS}} \
          --output type=local,dest={{.OUTPUT_DIR}} \
          .
      - task: qemu:verify

  qemu:verify:
    desc: Verify the built QEMU is the pinned version and exposes the devices we depend on.
    cmds:
      # Two halves: the files are checked where they were extracted, the behaviour where
      # the binary can actually run. The extracted binary is dynamically linked against the
      # build image's libraries, so it does not run on a bare runner (ADR-0025).
      - |
        set -euo pipefail
        bin={{.OUTPUT_DIR}}/bin/qemu-system-x86_64
        test -x "$bin" || { echo "missing $bin — run: task build:qemu"; exit 1; }
        test -x {{.OUTPUT_DIR}}/bin/qemu-storage-daemon
        # qemu-img is not a convenience: the Volume Agent refuses to start without
        # -qemu-img, because every qcow2 chain is created and inspected by running it
        # (v6 §7 forbids a parser of our own). Presence only — see qemu:verify:behaviour.
        test -x {{.OUTPUT_DIR}}/bin/qemu-img || {
          echo "missing {{.OUTPUT_DIR}}/bin/qemu-img — the Agent cannot create a chain without it; run: task build:qemu"; exit 1; }
        test -f {{.OUTPUT_DIR}}/share/spin-stack/qemu/bios-256k.bin
        # pvh.bin is how -kernel enters a PVH ELF kernel, which is the guest lane's
        # only boot path. Its absence fails at run time as a rom-open error, which
        # reads like a backend bug.
        test -f {{.OUTPUT_DIR}}/share/spin-stack/qemu/pvh.bin || {
          echo "missing pvh.bin — a direct kernel boot (-kernel) cannot work; rebuild with: task build:qemu"; exit 1; }
        echo "OK: the extracted tree carries qemu-system-x86_64, the storage daemon and the firmware (incl. pvh)"
      - task: qemu:verify:behaviour

  qemu:verify:behaviour:
    desc: Run the pinned QEMU and assert its version and devices, wherever that QEMU is actually runnable.
    cmds:
      # Ask whichever QEMU this caller will execute. The extracted binary runs on a
      # developer machine and inside CI's guest jobs (ADR-0025's runtime image, where there
      # is no docker to ask about an image — building one unconditionally failed there with
      # `"docker": executable file not found in $PATH`), and not on a bare runner building
      # the artefact for others: `liburing.so.2: cannot open shared object file`. So run it
      # if it runs and fall back to the image if it does not, printing which branch
      # answered.
      - |
        set -euo pipefail
        bin={{.OUTPUT_DIR}}/bin/qemu-system-x86_64
        # qemu-img is asked the same question in the same breath, because the Agent
        # refuses to start without one and a tree that carries a qemu-system nobody can
        # fault while its qemu-img is the wrong version is a lane that fails three tests
        # away from the cause.
        if out=$("$bin" --version 2>/dev/null && echo --- && "$bin" -device help 2>&1 && \
                 {{.OUTPUT_DIR}}/bin/qemu-img --version); then
          where="the binaries at {{.OUTPUT_DIR}}/bin"
        else
          img={{.QEMU_IMAGE}}:{{.QEMU_VERSION}}
          echo "$bin cannot run here (its libraries are the build image's) — asking the runtime image instead"
          task build:qemu:image
          out=$(docker run --rm --entrypoint /bin/sh "$img" -c \
            '/usr/local/bin/qemu-system-x86_64 --version; echo ---; /usr/local/bin/qemu-system-x86_64 -device help 2>&1; /usr/local/bin/qemu-img --version')
          where="$img"
        fi
        printf '%s' "$out" | grep -c 'version {{.QEMU_VERSION}}' | grep -qx 2 || {
          echo "in $where, qemu-system and qemu-img are not both the pinned {{.QEMU_VERSION}}:"
          printf '%s\n' "$out" | grep -i version; exit 1; }
        printf '%s' "$out" | grep -q '{{.QEMU_VERSION}}' || {
          echo "the QEMU in $where is not the pinned {{.QEMU_VERSION}}:"; printf '%s\n' "$out" | head -3; exit 1; }
        # virtio-blk-pci, not vhost-user-blk-pci: the guest gets an ordinary virtio disk
        # backed by a qcow2 QEMU opens itself. The build still enables the storage daemon.
        printf '%s' "$out" | grep -q 'virtio-blk-pci' || {
          echo "the QEMU in $where has no virtio-blk-pci device, so no guest can be given a qcow2"; exit 1; }
        echo "OK: $(printf '%s' "$out" | head -1), virtio-blk-pci present — verified in $where"

  build:guest:
    desc: Build the initramfs the guest lane boots (a static Go /init). The kernel comes from `task fetch:kernel`.
    sources:
      - integration/guestinit/**/*.go
      - hack/build-guest-initramfs.sh
    generates:
      - '{{.OUTPUT_DIR}}/guest/initramfs.cpio.gz'
    cmds:
      - OUT_DIR={{.OUTPUT_DIR}}/guest bash hack/build-guest-initramfs.sh

  fetch:kernel:
    desc: >-
      Put the pinned guest kernel at _output/guest/vmlinux, from a sibling spinbox
      checkout or from the mirrored image (ADR-0022). Idempotent; storage never builds one.
    env: &guest_kernel_env
      KERNEL: '{{.GUEST_KERNEL}}'
      KERNEL_SHA256: '{{.GUEST_KERNEL_SHA256}}'
      KERNEL_VERSION: '{{.GUEST_KERNEL_VERSION}}'
      SPINBOX_KERNEL: '{{.SPINBOX_KERNEL}}'
      KERNEL_IMAGE: '{{.GUEST_KERNEL_IMAGE}}'
    cmds:
      - bash hack/guest-kernel.sh fetch

  guest:verify:
    desc: Assert the guest lane's inputs — the initramfs we build, and that the kernel is the one we pinned.
    deps: [build:guest, fetch:kernel]
    env: *guest_kernel_env
    cmds:
      # The artefact is opened, not stat'ed: `test -f` says OK for a zero-byte file, a
      # half-written one and an archive with no /init, and `build:guest` fingerprints its
      # *sources*, so a truncated artefact is "up to date" (verified 2026-08-04 by emptying
      # the file: the old target printed OK and exited 0). cpio is required, not optional.
      - |
        set -euo pipefail
        img={{.OUTPUT_DIR}}/guest/initramfs.cpio.gz
        test -f "$img" || { echo "no initramfs at $img — run: task build:guest" >&2; exit 1; }
        command -v cpio >/dev/null || {
          echo "cpio is missing, so $img cannot be inspected (apt-get install cpio)" >&2; exit 1; }
        gzip -t "$img" 2>/dev/null || {
          echo "$img is not a valid gzip stream — a truncated or interrupted build; rebuild: task build:guest" >&2
          exit 1; }
        # ./init is the whole contract with the kernel: it mounts the archive as rootfs and
        # execs /init, and an archive without one panics with "no working init found",
        # which reads like a kernel problem rather than a missing build step.
        listing=$(gzip -dc "$img" | cpio --list --quiet 2>/dev/null || true)
        grep -qE '^(\./)?init$' <<<"$listing" || {
          echo "$img contains no ./init — the kernel would mount it and panic with no PID 1; rebuild: task build:guest" >&2
          exit 1; }
        echo "OK: $img — gzip cpio carrying ./init"
      - bash hack/guest-kernel.sh verify

  demo:stage1:
    desc: >-
      Stage 1 end to end with the real binaries and a real Linux guest: a volume is
      provisioned, the Agent prepares its qcow2 chain, a guest boots off that file and
      writes, the Agent is killed and restarted under the running guest, and a second
      boot reads the bytes back. Needs `task db:dev:up`, KVM, and the pinned artefacts.
    deps: [build:cmd, guest:verify]
    cmds:
      - DEVDB_PORT={{.DEVDB_PORT}} bash hack/stage1-demo.sh

  demo:stage2:
    desc: >-
      Stage 2 end to end: a Linux guest writes continuously while the Agent seals its tip
      and starts a new layer under it, several times, and a second boot reads every byte
      back through the resulting chain. Prints the measured snapshot pause, which is what
      v6 §11's defaults are waiting on. Needs `task db:dev:up`, KVM, and the pinned
      artefacts.
    deps: [build:cmd, guest:verify]
    cmds:
      - DEVDB_PORT={{.DEVDB_PORT}} bash hack/stage2-demo.sh

  demo:stage3:
    desc: >-
      Stage 3 end to end: a Linux guest writes while the Agent seals each tip and
      publishes it — layer, immutable manifest, compare-and-set on HEAD — and the bucket
      is then read back with `cat` to show the chain from HEAD is complete, every layer
      matches its digest, and none of them carries the guest's bytes in the clear. Needs
      `task db:dev:up`, KVM, and the pinned artefacts.
    deps: [build:cmd, guest:verify]
    cmds:
      - DEVDB_PORT={{.DEVDB_PORT}} bash hack/stage3-demo.sh

  demo:stage5:
    desc: >-
      Stage 5 end to end: an operator asks for a snapshot while a guest is writing, the
      Agent seals the tip because it was asked, and the catalog names a commit the bucket
      holds.
    deps: [build:cmd, guest:verify]
    cmds:
      - DEVDB_PORT={{.DEVDB_PORT}} bash hack/stage5-demo.sh

  demo:stage6:
    desc: >-
      Stage 6 end to end: a snapshot is cloned and a second guest boots the clone and reads
      back the bytes the parent's guest wrote.
    deps: [build:cmd, guest:verify]
    cmds:
      - DEVDB_PORT={{.DEVDB_PORT}} bash hack/stage6-demo.sh

  soak:
    desc: >-
      Run everything, over and over, until something breaks — the DST set across hundreds
      of seeds, the suites under -race, the three demonstrations with their parameters
      moved, and one with the Agent killed while it publishes. Runs in a git worktree
      pinned to a commit, so the checkout it came from can be edited while it runs.
      SOAK_SEEDS, SOAK_ROUNDS (0 = until stopped), SOAK_REF, SOAK_DIR.
    deps: [build:cmd, guest:verify]
    cmds:
      - DEVDB_PORT={{.DEVDB_PORT}} bash hack/soak.sh

  demo:stage4:
    desc: >-
      Stage 4 end to end: a guest writes and its Agent publishes, then the host is
      destroyed — the process killed and its whole data directory deleted — and a rebuilt
      machine with the same host id and an empty disk brings the volume back from the
      object store alone. A guest then reads what a guest on a host that no longer exists
      wrote. Needs `task db:dev:up`, KVM, and the pinned artefacts.
    deps: [build:cmd, guest:verify]
    cmds:
      - DEVDB_PORT={{.DEVDB_PORT}} bash hack/stage4-demo.sh

  diagrams:
    desc: Render the architecture diagrams from their .dot sources into the SVGs at the root.
    cmds:
      - |
        set -euo pipefail
        for src in *.dot; do
          out=${src%.dot}.svg
          docker run --rm -i --entrypoint dot {{.DOT_IMAGE}} -Tsvg <"$src" >"$out"
          echo "rendered $out"
        done

  diagrams:check:
    desc: >-
      Fail if a committed diagram is stale. This is the whole reason the .dot exists: the
      v5 diagrams described a withdrawn engine for a month — vhost-user, an encrypted WAL,
      CoW extents — because a picture is the one artefact nothing in a build ever reads.
    cmds:
      - task: diagrams
      - git diff --exit-code -- '*.svg'

  guest:kernel:pin:
    desc: "Print the sha256 of a kernel artefact, for bumping GUEST_KERNEL_SHA256. Usage: task guest:kernel:pin -- <file>"
    env: *guest_kernel_env
    cmds:
      - bash hack/guest-kernel.sh pin {{.CLI_ARGS}}

  guest:kernel:tag:
    desc: >-
      Print the content tag of the pinned guest kernel (sha256-<pin>) — the tag
      `guest:kernel:push` publishes alongside the version. CI resolves the mirror from
      this so no workflow spells the pin out a second time, and the tag is
      content-addressed for the same reason ADR-0022 pins by hash: a tag that can be
      moved is a kernel that can be swapped under a lane that already certified it.
    silent: true
    cmds:
      - echo "sha256-{{.GUEST_KERNEL_SHA256}}"

  guest:kernel:push:
    desc: >-
      Mirror the pinned kernel into a registry so machines with no spinbox checkout can
      run the lane (ADR-0022). Usage:
      task guest:kernel:push GUEST_KERNEL_IMAGE=ghcr.io/<owner>/<repo>/guest-kernel
      Requires a `docker login` to that registry.
    deps: [fetch:kernel]
    cmds:
      - |
        set -euo pipefail
        test -n "{{.GUEST_KERNEL_IMAGE}}" || {
          echo "set GUEST_KERNEL_IMAGE=<registry>/<path>/guest-kernel"; exit 1; }
        # A build context holding exactly the artefact: the image is one file on
        # scratch, so its digest is a hash of the kernel and of nothing else.
        ctx=$(mktemp -d); trap 'rm -rf "$ctx"' EXIT
        cp {{.GUEST_KERNEL}} "$ctx/vmlinux"
        # org.opencontainers.image.source links a ghcr.io package to a repository — and
        # only when Actions is the pusher; see readable_by_ci in
        # hack/publish-guest-inputs.sh. Derived from the target path rather than
        # configured: the only namespace CI resolves is ghcr.io/<owner>/<repo>/...
        # Same derivation in build:qemu:push.
        src=""
        case "{{.GUEST_KERNEL_IMAGE}}" in
          ghcr.io/*/*/*) slug={{.GUEST_KERNEL_IMAGE}}; slug=${slug#ghcr.io/}; slug=${slug%/*}
                         src="--label org.opencontainers.image.source=https://github.com/$slug" ;;
        esac
        docker buildx build \
          --file Dockerfile.guest-kernel \
          --target package \
          --platform linux/amd64 \
          $src \
          --tag {{.GUEST_KERNEL_IMAGE}}:{{.GUEST_KERNEL_VERSION}} \
          --tag {{.GUEST_KERNEL_IMAGE}}:sha256-{{.GUEST_KERNEL_SHA256}} \
          --push \
          "$ctx"
        echo
        echo "pull it back with the digest, not the tag:"
        echo "  task fetch:kernel GUEST_KERNEL_IMAGE={{.GUEST_KERNEL_IMAGE}}@\$(docker buildx imagetools inspect --format '{{`{{.Manifest.Digest}}`}}' {{.GUEST_KERNEL_IMAGE}}:{{.GUEST_KERNEL_VERSION}})"

  # The two artefacts CI's guest job needs and this repository does not build: the pinned
  # QEMU and the pinned kernel. `guest:inputs:check` names every input publishing them
  # needs; `guest:inputs:publish` performs the procedure rather than documenting it.
  guest:inputs:check:
    desc: >-
      Name every input publishing the guest artefacts needs (gh, a token with
      write:packages, docker, the pinned kernel), and say which are missing. No side effects.
    env: &publish_guest_env
      REPO: '{{.REPO | default ""}}'
      KERNEL: '{{.GUEST_KERNEL}}'
      KERNEL_SHA256: '{{.GUEST_KERNEL_SHA256}}'
      KERNEL_VERSION: '{{.GUEST_KERNEL_VERSION}}'
      SPINBOX_KERNEL: '{{.SPINBOX_KERNEL}}'
      QEMU_VERSION: '{{.QEMU_VERSION}}'
      TASK_EXE: '{{.TASK_EXE}}'
    cmds:
      - bash hack/publish-guest-inputs.sh check

  guest:inputs:publish:
    desc: >-
      Publish both guest artefacts — the pinned QEMU image (by dispatching the QEMU
      workflow) and the pinned guest kernel — then verify both resolve. Idempotent.
      Usage: task guest:inputs:publish REPO=<owner>/<repo>
    env: *publish_guest_env
    cmds:
      - bash hack/publish-guest-inputs.sh publish

  build:qemu:image:
    desc: Build the QEMU runtime image (used by the integration lane, not extracted).
    cmds:
      - |
        docker buildx build \
          --file Dockerfile.qemu \
          --target runtime \
          --platform linux/amd64 \
          --cache-from {{.QEMU_CACHE_FROM}} \
          --build-arg QEMU_VERSION={{.QEMU_VERSION}} \
          --build-arg JOBS={{.QEMU_JOBS}} \
          --tag {{.QEMU_IMAGE}}:{{.QEMU_VERSION}} \
          --load \
          .

  qemu:version:
    desc: Print the pinned QEMU version (the single source of truth for CI tags).
    silent: true
    cmds:
      - echo "{{.QEMU_VERSION}}"

  build:qemu:push:
    desc: >-
      Build and push the QEMU runtime image. Usage:
      task build:qemu:push QEMU_IMAGE=ghcr.io/<owner>/<repo>/qemu QEMU_IMAGE_EXTRA_TAG=<sha>
      Requires a `docker login` to that registry.
    vars:
      QEMU_IMAGE_EXTRA_TAG: '{{.QEMU_IMAGE_EXTRA_TAG | default ""}}'
    cmds:
      - |
        set -euo pipefail
        # The package→repository link, exactly as at guest:kernel:push and for the same
        # reason: an unlinked private package reads to CI as an unpublished one.
        src=""
        case "{{.QEMU_IMAGE}}" in
          ghcr.io/*/*/*) slug={{.QEMU_IMAGE}}; slug=${slug#ghcr.io/}; slug=${slug%/*}
                         src="--label org.opencontainers.image.source=https://github.com/$slug" ;;
        esac
        docker buildx build \
          --file Dockerfile.qemu \
          --target runtime \
          --platform linux/amd64 \
          --cache-from {{.QEMU_CACHE_FROM}} \
          --cache-to {{.QEMU_CACHE_TO}} \
          --build-arg QEMU_VERSION={{.QEMU_VERSION}} \
          --build-arg JOBS={{.QEMU_JOBS}} \
          $src \
          --tag {{.QEMU_IMAGE}}:{{.QEMU_VERSION}} \
          {{if .QEMU_IMAGE_EXTRA_TAG}}--tag {{.QEMU_IMAGE}}:{{.QEMU_IMAGE_EXTRA_TAG}} \{{end}}
          --push \
          .

  measure:publish:
    desc: >-
      What one commit costs against the pinned backend: the fixed cost of a commit and
      the rate its payload moves at. v6 §11 says the rotation threshold and the RPO are
      set by measuring and not by choosing, and these are the two numbers they are set
      from. This measures the container on localhost, where the fixed cost is one hop:
      run measure:publish:aws for the number a deployment actually gets.
    cmds:
      - MEASURE=1 RUSTFS_IMAGE={{.RUSTFS_IMAGE}} go test -tags integration -count=1 -v -timeout 30m
        -run TestMeasureWhatOneCommitCosts ./integration/backend/...

  measure:publish:aws:
    desc: >-
      The same measurement against real S3. The fixed cost of a commit is three round
      trips to a region, not to localhost, so this is the number that bounds a promised
      RPO — the container's says what the code costs, not what the network does. Uploads
      about 1 GiB.
    cmds:
      - MEASURE=1 SPIN_CONFORMANCE_BACKEND=aws go test -tags integration -count=1 -v -timeout 30m
        -run TestMeasureWhatOneCommitCosts ./integration/backend/...

  backend:conformance:
    desc: "§6.1/§25.4 object-store conformance suite against the pinned backend image (blocking per backend version)."
    cmds:
      - RUSTFS_IMAGE={{.RUSTFS_IMAGE}} go test -tags integration -count=1 -v ./integration/backend/...

  backend:conformance:aws:
    desc: "The same suite against real AWS S3. Needs credentials and creates ~20 buckets it deletes on the way out; not in ci:full, because the merge gate must not need a cloud account."
    cmds:
      - SPIN_CONFORMANCE_BACKEND=aws go test -tags integration -count=1 -v -timeout 30m ./integration/backend/...

  backend:conformance:aws:sweep:
    desc: "Delete the buckets an interrupted AWS conformance run left behind (spin-conf-*). Prints what it would remove unless CONFIRM=yes."
    cmds:
      - ./hack/s3-sweep.sh

  # --- build / test / lint ----------------------------------------------------

  build:
    desc: Build all packages and commands.
    cmds:
      - go build ./...

  build:cmd:
    desc: Build the binaries (volume-agent, control-plane) into _output/bin.
    vars:
      # The version each binary reports about itself: the Agent sends it in every
      # heartbeat (§13.4, fleet-mixed), so "dev" from an untagged build is a
      # deliberate answer, not a missing one.
      VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}/bin
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.OUTPUT_DIR}}/bin/ ./cmd/...

  test:
    desc: Run the full unit/property test suite with the race detector.
    cmds:
      - go test -race ./...

  test:integration:
    desc: Run Docker-gated integration tests (TestContainers Postgres).
    cmds:
      - go test -tags integration -count=1 ./internal/metadata/pg/...

  qemu:tools:
    desc: >-
      Put the pinned qemu-img, qemu-system-x86_64 and firmware under _output/, extracting
      them from the published runtime image when `task build:qemu` has not run here.
      Idempotent.
    status:
      # "it runs", not "the file is there". The two came apart once already: an extracted
      # binary whose libraries had not come with it is executable, and dies at exit 127 in
      # whatever lane first needs it — which was three e2e tests, not this task.
      - "{{.OUTPUT_DIR}}/bin/qemu-img --version"
      - "{{.OUTPUT_DIR}}/bin/qemu-system-x86_64 --version"
      - "test -f {{.OUTPUT_DIR}}/share/spin-stack/qemu/pvh.bin"
    cmds:
      # A second *source* for one artefact, not a second definition of the build — the
      # shape hack/guest-kernel.sh has for the kernel. `task build:qemu` compiles QEMU from
      # source, tens of minutes, and every lane that starts an Agent needs qemu-img. The
      # image is the one the QEMU workflow publishes, from the same builder stage.
      - |
        set -euo pipefail
        img={{.QEMU_IMAGE}}:{{.QEMU_VERSION}}
        BINARIES="qemu-img qemu-system-x86_64"
        command -v docker >/dev/null || {
          echo "no qemu-img at {{.OUTPUT_DIR}}/bin and no docker to fetch one — run: task build:qemu" >&2; exit 1; }
        docker image inspect "$img" >/dev/null 2>&1 || docker pull "$img" || {
          # Which of the two causes this is matters, because the fixes are opposites.
          # The tag is QEMU_VERSION, and the image is published by .github/workflows/qemu.yml
          # — a separate workflow. So the first push of a version bump races: this gate
          # starts while the image for the new tag is still being built, and no amount of
          # rebuilding *here* helps. Waiting does. That happened on the 11.0.2 → 11.1.1 bump,
          # where the advice below ("build it") was the wrong advice, confidently given.
          echo "no $img locally and it could not be pulled." >&2
          echo "  If QEMU_VERSION changed in this commit: .github/workflows/qemu.yml publishes" >&2
          echo "  that tag and takes tens of minutes. Let it finish, then re-run this." >&2
          echo "  Otherwise the tag should already exist — build it locally: task build:qemu" >&2
          exit 1; }
        mkdir -p {{.OUTPUT_DIR}}/bin
        cid=$(docker create "$img")
        trap 'docker rm -f "$cid" >/dev/null' EXIT
        # Two binaries and one firmware tree, because two different lanes need different
        # halves and neither is worth a second task: an Agent needs qemu-img to create and
        # inspect a chain, and the guest lane also needs a QEMU to boot and the firmware
        # to boot *with* — pvh.bin above all, since a direct kernel boot has no entry
        # point without it and fails as a rom-open error that reads like a backend bug.
        for b in $BINARIES; do
          docker cp -L "$cid":/usr/local/bin/"$b" {{.OUTPUT_DIR}}/bin/"$b".real
        done
        rm -rf {{.OUTPUT_DIR}}/share/spin-stack/qemu
        mkdir -p {{.OUTPUT_DIR}}/share/spin-stack
        docker cp "$cid":/usr/share/spin-stack/qemu {{.OUTPUT_DIR}}/share/spin-stack/qemu

        # And the libraries it links against, computed *inside the image*: the binary is
        # dynamically linked (liburing, libaio, glib), and extracting it alone produced a
        # file that ran on a developer's machine and died on a CI runner with
        # "liburing.so.2: cannot open shared object file". A hand-written apt-get list is a
        # second statement of that, kept in step by nobody. The interpreter counts too —
        # ldd names the loader on its own line, with no `=>`.
        rm -rf {{.OUTPUT_DIR}}/lib/qemu && mkdir -p {{.OUTPUT_DIR}}/lib/qemu
        for so in $(docker run --rm --entrypoint sh "$img" -c \
              "for b in $BINARIES; do ldd /usr/local/bin/\$b; done" \
              | sed -n -e "s|.*=> \(/[^ ]*\).*|\1|p" -e "s|^\t\(/[^ ]*\) (0x.*|\1|p" | sort -u); do
          # -L, because these are symlinks: /lib/x86_64-linux-gnu/liburing.so.2 points at
          # liburing.so.2.14 and /lib64/ld-linux-x86-64.so.2 points out of its own
          # directory. Copied as links they land dangling, and the failure that produces is
          # indistinguishable from having copied nothing at all — which is how the first
          # attempt at this looked like it had worked.
          docker cp -L "$cid":"$so" {{.OUTPUT_DIR}}/lib/qemu/
        done

        # A wrapper and not an RPATH rewrite: patchelf would be one more pinned tool in the
        # gate. It invokes the image's *loader* rather than setting LD_LIBRARY_PATH, so the
        # host's glibc is not in the picture at all: LD_LIBRARY_PATH would have this
        # binary's libc.so.6 loaded by whatever loader the host has, and those two are one
        # unit. Verified by running it on debian:12, whose glibc is older than the image's.
        ld=$(basename $(ls {{.OUTPUT_DIR}}/lib/qemu/ld-linux-*))
        for b in $BINARIES; do
          cat > {{.OUTPUT_DIR}}/bin/"$b" <<WRAP
        #!/bin/sh
        # Generated by \`task qemu:tools\`. Runs the pinned binary against the loader and
        # libraries extracted from the same image, so a host that has neither still works.
        here=\$(cd "\$(dirname "\$0")" && pwd)
        exec "\$here/../lib/qemu/$ld" --library-path "\$here/../lib/qemu" \\
          "\$here/$b.real" "\$@"
        WRAP
          sed -i 's/^        //' {{.OUTPUT_DIR}}/bin/"$b"
          chmod +x {{.OUTPUT_DIR}}/bin/"$b"
          {{.OUTPUT_DIR}}/bin/"$b" --version >/dev/null || {
            echo "extracted $b does not run on this host" >&2; exit 1; }
        done
        echo "extracted $BINARIES, their loader and $(ls {{.OUTPUT_DIR}}/lib/qemu | wc -l) libraries from $img"

  test:e2e:
    desc: >-
      Run the deployment, not the library: the real control-plane and volume-agent
      as processes, against a real Postgres 18 and the pinned RustFS. It is the only
      lane that can see the two binaries disagree — about a key file, about a flag
      nobody passes — because everything else drives Go types in-process.
    # qemu:tools and not build:qemu: the Agent creates every chain by running the pinned
    # qemu-img, so this lane cannot start one without it, and compiling QEMU here would
    # put tens of minutes into the merge gate.
    deps: [build:cmd, qemu:tools]
    cmds:
      - RUSTFS_IMAGE={{.RUSTFS_IMAGE}} go test -tags e2e -count=1 -timeout 15m ./integration/e2e/...

  cover:
    desc: Cross-package coverage report; enforces a 90% floor on production code.
    cmds:
      - bash hack/coverage.sh

  deadcode:
    desc: >-
      Fail on a function no binary reaches that neither hack/deadcode-allow.txt nor
      hack/deadcode-pending.txt accounts for (CLAUDE.md: "a component with no caller is a
      liability, not progress"). In `ci`.
    # A ratchet over the set of unreachable symbols, not a count; the two lists, the
    # rejected alternatives and the blind spots are in hack/deadcode.sh.
    deps: [tools:deadcode]
    cmds:
      - DEADCODE={{.TOOLS_BIN}}/deadcode bash hack/deadcode.sh

  dev:entries:
    desc: >-
      List the open DEV entries in STATUS.md and who owes each decision, and fail on one
      that hack/dev-entries-open.txt does not pin (CLAUDE.md's gate: "No open DEV entry
      that this increment introduced"). In `ci`.
    # A ratchet over the set of open DEV entries; the rejected alternatives and the
    # heading-only parsing are in hack/dev-entries.sh.
    cmds:
      - bash hack/dev-entries.sh

  status:cap:
    desc: "Fail when docs/plan/STATUS.md is over its 120-line cap (CLAUDE.md)."
    cmds:
      # STATUS.md holds what to do next and which thin paths are not deepened; a file that
      # outgrows a screen has started holding history, and history is `git log`.
      - |
        set -euo pipefail
        n=$(wc -l <docs/plan/STATUS.md)
        test "$n" -le 120 || {
          echo "docs/plan/STATUS.md is $n lines, over the 120-line cap: something in it is not state" >&2
          exit 1; }
        echo "OK: docs/plan/STATUS.md is $n lines"

  comment:rot:
    desc: >-
      Fail on a production comment that describes a mechanism ADR-0026 withdrew — the
      upload chain, the checkpoint, the GC, the lease gate — as if it were still here,
      unless hack/comment-rot-allow.txt or hack/comment-rot-pending.txt accounts for it.
      In `ci`.
    # A ratchet over the set of comments naming a withdrawn mechanism; the two lists, the
    # rejected alternatives and the identifier-aware matching are in the script.
    cmds:
      - bash hack/comment-rot.sh

  refs:
    desc: >-
      Fail on prose that points at something that is not there — a repository path, an ADR
      id, or a symbol of a package this tree deleted — unless hack/refs-allow.txt says
      naming it is the point. It needs no vocabulary: what is gone is derived from what
      does not resolve. In `ci`.
    cmds:
      - bash hack/refs.sh

  lint:
    desc: Run golangci-lint plus the custom simulable analyzer (§25.1/INV-01).
    cmds:
      - task: lint:golangci
      - task: lint:simulable
      - task: lint:proto

  lint:golangci:
    desc: Run golangci-lint (incl. forbidigo/depguard belt-and-suspenders).
    deps: [tools:golangci]
    cmds:
      # The build tags matter: without them golangci-lint never parses a single file
      # under `integration/` or `internal/testinfra`, so the entire integration and
      # e2e surface was unlinted — including the lanes that drive QEMU and Postgres.
      # Found 2026-08-02, when the e2e lane's own files turned out to be invisible to
      # the gate that was supposed to check them.
      - "{{.TOOLS_BIN}}/golangci-lint run --build-tags integration,e2e ./..."

  lint:simulable:
    desc: Run the authoritative simulable-interfaces analyzer over all packages.
    cmds:
      # Same build tags as lint:golangci, one step later, so the authoritative INV-01 layer
      # does not check a smaller tree than its belt-and-suspenders one.
      # `-tags` on the analyzer binary is deprecated and does nothing; GOFLAGS is what
      # reaches go/packages' `go list` child, which is why the tags are environment.
      - GOFLAGS=-tags=integration,e2e go run {{.SIMULABLE}} ./...

  dst:
    desc: Run the mandatory Deterministic Simulation Testing scenario set (§25.1, §25.2).
    cmds:
      # No `-run` filter, deliberately: `go test -run <regex>` exits 0 printing "[no tests
      # to run]" when the regex matches nothing, so a list of test names here is a gate
      # that can report success having proven nothing. A `go test -list` preflight was
      # rejected — it writes the same names down twice, and in ./internal/dst it exits 1
      # anyway (TestMain's audit that every checker caught a planted bug skips when
      # test.run is non-empty). Filtering also switched that audit off. `-count=1` stays.
      # When the commit protocol's serialize/replay property test lands, its package
      # belongs on this list too.
      - go test -race -count=1 ./internal/dst/

  fmt:
    desc: Format code with the pinned golangci-lint formatters (gofmt + goimports).
    deps: [tools:golangci]
    cmds:
      - "{{.TOOLS_BIN}}/golangci-lint fmt ./..."

  fmt:check:
    desc: Fail if any file is unformatted (what CI enforces, before the slower linters).
    deps: [tools:golangci]
    cmds:
      - "{{.TOOLS_BIN}}/golangci-lint fmt --diff ./..."

  workflows:verify:
    desc: >-
      Assert every `task <name>` in .github/workflows resolves against this Taskfile.
      No workflow here has ever executed, so this is the only thing that checks them.
    cmds:
      - TASK_EXE={{.TASK_EXE}} bash hack/workflow-tasks.sh

  ci:
    desc: Fast local gate — format, build, lint, deadcode, open DEV entries, comment rot, test, dst. No Docker required.
    cmds:
      - task: fmt:check
      - task: build
      - task: lint
      # Beside lint, and before the race suite: it is static analysis over the built
      # program, it costs about two seconds, and an unreachable symbol reported after
      # twenty seconds of tests is a report that arrives once nobody is watching.
      - task: deadcode
      # Beside deadcode: two files read, no toolchain, and it prints the open entries on a
      # green run so they are read by whoever runs the gate.
      - task: dev:entries
      # The same rule pointed at the comments that replaced the deleted Markdown. One `go
      # list`, one awk pass.
      - task: comment:rot
      - task: refs
      # Beside it, and the same kind of claim: a rule CLAUDE.md states as part of "done"
      # that nothing computed. One `wc`.
      - task: status:cap
      - task: test
      - task: dst
      # In the *fast* gate: renaming a Taskfile target is a local edit whose only victim is
      # a workflow file, and the person renaming it runs `task ci`, not `ci:full`.
      - task: workflows:verify

  # --- the merge gate ----------------------------------------------------------
  #
  # One gate. `ci:noguest` existed to name the weaker claim while a guest lane could skip
  # itself and still report a pass; it went with the vhost-user-blk lanes it arbitrated.
  # When the qcow2 lane lands, a machine without the pinned QEMU and kernel must again be
  # unable to report a green merge gate — that is what it comes back as.

  ci:full:
    desc: >-
      The merge gate: everything CI runs, including the Docker-gated lanes. `task ci` is
      the fast local loop.
    cmds:
      - task: ci:lanes

  ci:lanes:
    internal: true
    desc: >-
      The list of lanes the merge gate runs. It is a target of its own rather than
      `ci:full`'s body because it was shared by two public gates and will be again when
      the qcow2 lane restores the guest-backed half. The Docker-gated tasks live in it
      because a task nobody runs is a task nobody notices going red: backend:conformance
      was broken on main for a whole increment because it was documented but not gated.
    cmds:
      - task: ci
      - task: generate:check
      - task: diagrams:check
      - task: db:verify
      - task: cover
      - task: test:integration
      - task: backend:conformance
      - task: test:e2e
