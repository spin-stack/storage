name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      # Every other tool (sqlc, pgschema, golangci-lint) is pinned in the Taskfile and
      # installed into ./.tools/bin by `task tools` — the same command a developer
      # runs locally, so CI and laptops cannot drift.
      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}

      - name: Install pinned tools
        run: task tools

      # The standard gate (CLAUDE.md, "The gate"): format, generated-code freshness,
      # build, lint (incl. the custom simulable analyzer / INV-01), test, DST.
      - name: Format check
        run: task fmt:check

      - name: Generated code is current (sqlc, ADR-0006)
        run: task generate:check

      - name: Build
        run: task build

      - name: Lint (golangci + simulable / INV-01)
        run: task lint

      - name: Test
        run: task test

      - name: Coverage (90% floor on production code)
        run: task cover

      - name: DST (mandatory scenario set)
        run: task dst

      # The schema is state-based (ADR-0019): there is no checksum chain to verify.
      # Instead, build the database the way production would — apply schema.sql to an
      # empty Postgres 18 — and assert a plan against the result has nothing left to
      # do. It fails on anything pgschema can apply but not read back, which a
      # checksum over file bytes could never see.
      - name: Schema verify (pgschema, ADR-0019)
        run: task db:verify

      # TestContainers Postgres integration (ADR-0006); ubuntu runners have Docker.
      - name: Integration (TestContainers Postgres)
        run: task test:integration

      # §6.1: the object-store conformance suite against the pinned RustFS image.
      # Blocking per backend version — every durability proof in this repo assumes
      # the properties this suite certifies (conditional writes, versioning, a
      # strongly consistent LIST), so a backend that loses one must not merge.
      - name: Object-store conformance (RustFS, §6.1)
        run: task backend:conformance
