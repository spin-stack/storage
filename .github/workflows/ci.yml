name: CI

on:
  push:
  pull_request:

# One run per branch, not one per event. A push to a branch that already has an open
# pull request fires both triggers and produces two identical runs; keying the group on
# `head_ref || ref_name` gives both the same string ("my-branch"), so they collapse.
# Keying on `github.ref` — the obvious choice — does not: a pull_request run is
# `refs/pull/N/merge` and a push run is `refs/heads/my-branch`, two groups, nothing
# de-duplicated. `cancel-in-progress` then makes a new push supersede its predecessor,
# on main as well: the gate's answer is about the tip, and a run against a commit that
# is already history is spending a runner to answer a question nobody asked.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege by default: the gate reads the tree and nothing else. The jobs that
# touch GitHub Packages raise it to `packages: read` themselves, at the job, so the
# reason is next to the need.
permissions:
  contents: read

# ---------------------------------------------------------------------------------
# The shape of this workflow, and why it is two jobs again.
#
# It was five. Three of them existed because `task ci:full` could not run on one hosted
# runner: the lanes that booted a guest needed the pinned QEMU, which is only executable
# inside the published runtime image (ADR-0025 — the binaries are dynamically linked
# against what that image provides), and a container job gets no Docker daemon of its own,
# which the TestContainers lanes need. So the gate was assembled from jobs that each had
# one of the two, plus a job to fetch the artefacts they shared.
#
# That constraint is gone with the lanes it applied to. The guest-backed proofs drove a
# real Linux kernel against this system's own vhost-user-blk backend, and that backend is
# withdrawn — QEMU manages the local copy-on-write format through qcow2 now, and what this
# system keeps is immutable commits, publication and recovery. Nothing left in the merge
# gate needs QEMU, and everything left needs Docker, which one ordinary runner has. So
# `ci:full` runs here as the single command it is.
#
# The pinned QEMU is still built and published by qemu.yml, and `task fetch:kernel` still
# resolves the pinned kernel: both are inputs the qcow2 lane needs, and when that lane
# lands this file grows a job for it and `ci:full` grows a preflight — the shape the three
# deleted jobs had, which is why the reasoning above is kept rather than deleted with them.
#
# The `gate` job stays regardless, and its reason never depended on the split: `needs`
# alone does not make a gate, because a needed job that is *skipped* leaves the dependent
# job free to run and a workflow of green-or-grey jobs is reported as passing.
# ---------------------------------------------------------------------------------

jobs:
  # The merge gate, run as the one target a developer runs. It is `ci:full` and not a
  # list of steps for the reason the Taskfile exists: a second definition of what the gate
  # is, maintained in a workflow file, goes out of step with the first exactly when a lane
  # is added.
  ci:
    runs-on: ubuntu-latest
    # Measured against nothing — these workflows have never executed (STATUS.md) — so
    # this is a ceiling, not a budget: enough for the race suite, the coverage run and
    # the Docker-backed lanes (e2e alone allows itself 15m) on a two-core runner, and far
    # below the six-hour default that would let one wedged TestContainer hold a runner
    # for a working day.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      # Every other tool (sqlc, pgschema, golangci-lint, buf and the proto plugins) is
      # pinned in the Taskfile and installed into ./.tools/bin by `task tools` — the same
      # command a developer runs locally, so CI and laptops cannot drift.
      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}

      # The gate's own targets declare these as `deps`, so this step is not what makes
      # them present; it is what makes a toolchain download fail under its own name and
      # populates the cache above.
      - name: Install pinned tools
        run: task tools

      - name: The merge gate (task ci:full)
        run: task ci:full

  # The gate. This is the check to require on the branch, and the only job here whose
  # green means what a reader assumes it means.
  #
  # `needs` does not do this on its own: a needed job that is *skipped* leaves the
  # dependent job free to run, and a workflow all of whose jobs are green-or-grey is
  # reported as a passing run. That is the same defect as `task ci:full` exiting 0 after
  # printing SKIP, one level up, and this job is the same fix — a lane that did not run
  # is a lane that did not pass. It stays a job of its own with one `needs` entry because
  # the qcow2 lane restores the second, and a gate assembled only when there is something
  # to assemble is a gate nobody adds back.
  #
  # `if: always()` is required, not decorative: without it this job is itself skipped the
  # moment anything it needs fails, and a skipped gate is a gate that never says no.
  gate:
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every lane ran, and every lane passed
        env:
          # The whole `needs` context, serialized. This was one hand-written
          # `job=${{ needs.<job>.result }}` line per needed job — a second list of lanes
          # beside `needs:`, with nothing holding the two equal. That is the same defect
          # this workflow exists to remove, one level in: a job added to `needs` and
          # forgotten here is a lane the gate does not check and reports green for, and
          # nothing about the run looks wrong. `toJSON(needs)` is the same object
          # `needs.<job>.result` reads from, so there is exactly one list now — the
          # `needs:` above.
          #
          # jq is preinstalled on hosted Ubuntu runners and this job is not a container
          # job, so it is there; if it ever is not, `set -e` makes that a red gate rather
          # than a green one, which is the direction every failure in this file leans.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          results=$(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          # An enumeration that came back empty is the no-op that reports success — the
          # shape of every defect this gate was built to remove (a `-run` regex matching
          # no tests, a lane skipping itself, a target exiting 0 after printing SKIP).
          # A gate with no lanes has not passed; it has failed to run.
          if [ -z "$results" ]; then
            echo "::error::the gate enumerated no lanes — it would be green having checked nothing"
            exit 1
          fi
          failed=0
          {
            echo "## Gate"
            echo
            echo "| lane | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            echo "| \`$job\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then
              failed=1
              # "skipped" is the case worth spelling out: it is not a neutral outcome
              # here, it is a proof this repository claims to make and did not.
              echo "::error::$job did not pass (${result:-no result}) — the gate is not green"
            fi
          done <<< "$results"
          if [ "$failed" -ne 0 ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "A lane that was **skipped** counts as a failure: a run that did not make a" >> "$GITHUB_STEP_SUMMARY"
            echo "proof this repository claims has not passed the gate, it has failed to reach it." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every lane ran and passed"
