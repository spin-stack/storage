name: QEMU

# The pinned QEMU (CLAUDE.md, and QEMU_VERSION in Taskfile.yml) takes tens of minutes to
# build from source, far too slow for the per-push gate. So it is its own workflow,
# triggered only when something that can change the artefact changes, and it publishes a
# runtime image for the lanes plus the extracted binaries as an artefact.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.qemu
      - .github/workflows/qemu.yml
      - Taskfile.yml # the version and the build flags live here
  pull_request:
    paths:
      - Dockerfile.qemu
      - .github/workflows/qemu.yml
      - Taskfile.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold QEMU build is tens of minutes and a warm one is a cache restore, so the
    # spread is wide and the ceiling has to sit above the cold case. What it is really
    # for is the other end: the default is six hours, and a `configure` that stops on a
    # prompt or a registry that never answers would hold a runner for all of them
    # without ever printing a failure.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The pinned version comes from the Taskfile, never from a literal here: two
      # places to bump is how CI and production end up on different QEMUs.
      - name: Read the pinned QEMU version
        id: qemu
        run: echo "version=$(task qemu:version)" >> "$GITHUB_OUTPUT"

      # `task qemu:build` runs the same buildx command a developer runs, with the GitHub
      # Actions cache backend. It ends in `task qemu:verify`, so a build that produced the
      # wrong version or lost a device we depend on fails here, not in a lane weeks later.
      - name: Build QEMU and verify what came out
        run: task qemu:build QEMU_CACHE_FROM=type=gha QEMU_CACHE_TO=type=gha,mode=max QEMU_JOBS=4

      - name: Upload the extracted binaries
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ steps.qemu.outputs.version }}-linux-amd64
          path: _output/
          retention-days: 30
          if-no-files-found: error

      # Publishing is skipped for pull requests: a fork's token cannot write packages,
      # and an unreviewed branch has no business claiming the version tag.
      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: the QEMU version, which is what everything pins, and the commit,
      # which is what makes a specific build reproducible when the version tag has
      # moved because a flag changed.
      - name: Publish the runtime image
        if: github.event_name != 'pull_request'
        run: |
          task qemu:push \
            QEMU_IMAGE=ghcr.io/${{ github.repository }}/qemu \
            QEMU_IMAGE_EXTRA_TAG=${{ github.sha }} \
            QEMU_CACHE_FROM=type=gha \
            QEMU_CACHE_TO=type=gha,mode=max \
            QEMU_JOBS=4
