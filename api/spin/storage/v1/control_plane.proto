syntax = "proto3";

// Package spin.storage.v1 is the RPC surface between a Volume Agent and the
// Control Plane (ADR-0018). It is deliberately small: the Agent *pulls*, so
// every call below is one the Agent makes, and there is no way for the Control
// Plane to reach into a host. A partitioned Agent simply stops learning, its
// lease lapses, and §12 fencing does the rest.
package spin.storage.v1;

option go_package = "github.com/spin-stack/storage/api/gen/spin/storage/v1;storagev1";

// ControlPlaneService is what a Volume Agent talks to. Three calls make the
// loop — say what this host is (Heartbeat), ask what it should be serving
// (GetDesiredState), say what it observed (ReportVolumeState) — and a fourth,
// off the loop, hands over the key material a volume cannot be opened without.
//
// Attach/detach are deliberately absent: a volume's lifecycle is driven by the
// desired state the Agent reconciles against, not by commands, and the data path
// that would honour an attach does not exist yet (ADR-0018 §2).
service ControlPlaneService {
  // Heartbeat reports the host's identity, its capabilities, and the state of
  // its local device, and renews the host lease (§12.6). It is the call that
  // finally writes host.nvme_used_bytes — the input every ADR-0013 threshold
  // needs and that nothing has ever produced.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // GetDesiredState returns the volumes this host should be serving. The Agent
  // reconciles towards it; a volume that disappears from the answer is a volume
  // the Agent must stop serving.
  rpc GetDesiredState(GetDesiredStateRequest) returns (GetDesiredStateResponse);

  // ReportVolumeState reports epoch-qualified watermarks. The epoch is the point:
  // a report from a fenced writer names an epoch the volume has moved past, and
  // is refused rather than applied (INV-03, §12.3).
  rpc ReportVolumeState(ReportVolumeStateRequest) returns (ReportVolumeStateResponse);

  // GetVolumeKeys returns the wrapped DEK of one volume, and the id of the KEK
  // that wraps it (§15.1). Without it the desired state is an instruction the
  // Agent cannot carry out: every payload on this path is sealed with the
  // volume's DEK before it reaches the WAL or an S3 object.
  //
  // It is a call of its own rather than fields on DesiredVolume, for three
  // reasons that all point the same way:
  //
  //   - Exposure. Key material is the one thing on this surface whose leak is
  //     not repaired by re-reading the truth from S3. A separate call is
  //     authorised per request against the volume's current primary, so a host
  //     that has been fenced, or that never held the volume, is refused. Bundled
  //     into a list answer there is no such granularity: the only unit available
  //     to check is the whole list.
  //   - Frequency. The desired state is polled by every host every few seconds,
  //     for every volume it holds. Bundled, a wrapped DEK would cross the wire
  //     thousands of times a day per volume, in exactly the message an operator
  //     is most likely to dump while debugging an incident.
  //   - Cacheability. The two have opposite lifetimes. Desired state is expected
  //     to change and is re-read for that reason; key material does not change
  //     while the volume is this host's, so it is fetched once and held, and
  //     dropped when the volume leaves the desired state.
  rpc GetVolumeKeys(GetVolumeKeysRequest) returns (GetVolumeKeysResponse);
}

// HostState mirrors internal/lifecycle.HostState (§28.1). The Agent needs it to
// know it has been cordoned: only ACTIVE takes new volumes, and a CORDONED or
// DRAINING host keeps serving (and keeps its lease) while it is evacuated.
enum HostState {
  HOST_STATE_UNSPECIFIED = 0;
  HOST_STATE_ACTIVE = 1;
  HOST_STATE_CORDONED = 2;
  HOST_STATE_DRAINING = 3;
  HOST_STATE_DEAD = 4;
}

// VolumeState mirrors internal/lifecycle.VolumeState — the Control Plane's view
// of writer ownership (§7).
enum VolumeState {
  VOLUME_STATE_UNSPECIFIED = 0;
  VOLUME_STATE_ACTIVE = 1;
  VOLUME_STATE_PRIMARY_SUSPECTED = 2;
  VOLUME_STATE_FENCING_WAIT = 3;
  VOLUME_STATE_RECOVERY_REQUIRED = 4;
  VOLUME_STATE_RECOVERING = 5;
  VOLUME_STATE_DETACHED = 6;
}

// DeviceStatus is what the Agent observes about the NVMe device it owns
// (ADR-0013). All three numbers are needed and none is derivable from the
// others: total and used give the pressure thresholds, and the remote backlog is
// the part of `used` that no amount of local truncation can reclaim, because it
// is bytes no verified object covers yet (INV-13).
message DeviceStatus {
  // total_bytes is the capacity of the device backing the WAL and checkpoints.
  int64 total_bytes = 1;
  // used_bytes is what this Agent is occupying on it right now.
  int64 used_bytes = 2;
  // remote_backlog_bytes is the sum, over every volume on this host, of the
  // bytes that are not yet covered by a verified object. Per-volume
  // backpressure (wal.Limits.MaxRemoteGapBytes) never sums to a device budget
  // on its own — this is the number that does (ADR-0013 §1).
  int64 remote_backlog_bytes = 3;
}

message HeartbeatRequest {
  // host_id is the fleet identity of this host.
  string host_id = 1;
  // agent_version is the build the Agent is running (fleet-mixed, §27 — INV-19).
  string agent_version = 2;
  // max_format_version is the highest on-disk/on-S3 format this Agent can read
  // and write. The Control Plane never places a volume on a host that cannot
  // read its format.
  int32 max_format_version = 3;
  // device is the local device budget picture (ADR-0013).
  DeviceStatus device = 4;
}

message HeartbeatResponse {
  // lease_ttl_seconds is the TTL the host lease was renewed with. The Agent
  // anchors it to the instant the *request left*, never to the answer's arrival
  // (§12.2), which is what keeps its validity window a subset of the Control
  // Plane's.
  int32 lease_ttl_seconds = 1;
  // state is the fleet state the Control Plane holds for this host (§28.1).
  HostState state = 2;
  // term is the Control Plane term that served this heartbeat. It is
  // informative — the Agent does not guard on it — and exists so an operator
  // reading an Agent's logs during an incident can see which leader answered.
  int64 term = 3;
}

message GetDesiredStateRequest {
  string host_id = 1;
}

// DesiredVolume is one volume this host should be serving.
message DesiredVolume {
  string volume_id = 1;
  int64 size_bytes = 2;
  int32 block_size = 3;
  // epoch is the volume's current epoch (§12.3). Everything the Agent later
  // reports about this volume is qualified by it.
  int64 epoch = 4;
  VolumeState state = 5;
  // 6 was `Durability durability`, the per-volume §14.8 FLUSH/FUA ACK contract.
  // ADR-0026 withdrew the remote mode, so the local ACK is the only contract and
  // there is nothing for the Agent to be told; it never read the field. Reserved
  // rather than reused because a peer built before this change decodes field 6 as
  // an enum, and a new field with a different type at the same number is the one
  // way a wire format lies to a reader that is otherwise doing everything right.
  reserved 6;
  // parent_snapshot_id and parent_volume_id name the snapshot this volume was
  // cloned from (§20), and the volume that snapshot belongs to. Both empty for a
  // volume that was created rather than cloned.
  //
  // They are on the wire because the Agent has to be *told*: ADR-0021 keeps it from
  // knowing what a Control Plane is, so it cannot look either of them up. Without
  // them a clone starts an empty WAL under its own id, finds nothing under that id
  // in the object store, and serves zeros for everything its parent ever wrote —
  // which is a volume advertised as a copy and delivered blank (DEV-0007).
  //
  // The volume id is carried rather than derived for the same reason: it lives on
  // the snapshot row, which is one lookup the Agent cannot perform.
  string parent_snapshot_id = 7;
  string parent_volume_id = 8;
  // pending_snapshot_id names a snapshot this volume's host is asked to take (§19),
  // empty when there is nothing to take. It is the whole trigger: an Agent is never
  // *asked* for anything — ADR-0021 keeps it from knowing what a Control Plane is —
  // so a snapshot request reaches it the only way anything does, as desired state it
  // converges on.
  //
  // One id, not a list, and the oldest when several are outstanding: the Agent takes
  // them one per cycle, which needs no batching and cannot reorder them.
  //
  // The field clears itself. The Control Plane stops sending an id once the snapshot
  // leaves CREATING, so a host that missed the report, restarted, or came back after
  // a partition converges by doing the same thing again — and doing it again is free,
  // because the manifest is written create-only (INV-16).
  string pending_snapshot_id = 9;

  // published_sequence and durable_sequence are the two numbers the catalog already
  // holds about this volume's data and that the attach path had no way to ask for.
  // That is the whole of the two failures they close: both were reproduced against
  // real binaries, and in both the fact that would have caught them was sitting in
  // Postgres while the Agent decided, alone, that finding nothing means there was
  // never anything.
  //
  // published_sequence is the highest sequence a published image is known to
  // reproduce. It is what tells "this volume has never stopped cleanly, boot it
  // empty" apart from "its manifest is gone". Without it a stray delete, a lifecycle
  // expiry, or a restore that missed one key produces a blank device with an INFO
  // line — and the next graceful stop replaces the volume's real image with the
  // blank one's successor, which makes it permanent.
  //
  // durable_sequence is the highest sequence this fleet ACKed to a guest's fsync. It
  // is the floor an attach has to be able to reproduce out of its image plus whatever
  // its local WAL replayed; coming back below it is the volume silently rolled back
  // to an earlier state, which reads without an I/O error anywhere.
  //
  // They are on the wire for the same reason the parent ids are: ADR-0021 keeps the
  // Agent from knowing what a Control Plane is, so it cannot look either of them up.
  // They are floors to *check* against and never inputs to the read path — the object
  // store stays the authority on what the volume holds, and these only decide whether
  // what it holds is enough.
  //
  // Both can lag and neither can lead, which is what makes checking them safe. The
  // catalog is written from a report the Agent sends after the fdatasync and after
  // the publish, so an attach that satisfies these floors may legitimately be ahead
  // of them; one that falls below them has lost data. Comparing with < rather than !=
  // is that asymmetry.
  int64 published_sequence = 10;
  int64 durable_sequence = 11;

  // rpo_target_seconds is how far behind the object store this volume is allowed to
  // fall: the age at which the host seals its tip and commits it even though the tip
  // has not reached the size threshold. Zero means the volume has no age trigger and
  // commits on size alone.
  //
  // It is per volume and on the wire because it is a promise made to a tenant, and the
  // Control Plane is the only party that knows what was promised — the size threshold
  // next to it is the host's own affair (how much one layer costs to upload, how long a
  // recovery takes) and is a process flag. Splitting them that way is v6 §11: an
  // operator sizing a fleet and a tenant buying an RPO are setting different things.
  //
  // Seconds and not a Duration: the smallest RPO worth promising over an object store
  // is measured in tens of seconds, and an integer that a human can read in a desired
  // state dump is worth more here than a resolution nothing can deliver.
  //
  // It does not make an idle volume commit. §11's first invariant is that a volume
  // nobody writes to does not produce layers, and the age trigger keeps it: the tip
  // must also have grown past an empty image before age can fire it, so a volume that
  // wrote nothing is *inside* its target rather than behind it.
  int64 rpo_target_seconds = 12;
}

message GetDesiredStateResponse {
  // volumes is ordered by volume id, deterministically (INV-02).
  repeated DesiredVolume volumes = 1;
}

message GetVolumeKeysRequest {
  // host_id is the host asking. The answer is refused unless it is the volume's
  // current primary: this is where a fenced host stops being able to open what
  // it used to serve.
  string host_id = 1;
  string volume_id = 2;
}

// GetVolumeKeysResponse is what a host needs to seal and open this volume's
// payloads, and nothing more. The Control Plane never holds the KEK — unwrapping
// happens on the host, against the KMS it already reaches (§15.1) — so this
// answer is inert to anyone who cannot reach that KMS.
message GetVolumeKeysResponse {
  string volume_id = 1;
  // dek_wrapped is the volume's data-encryption key sealed under the KEK, byte
  // for byte as the catalog holds it (§8, volumes.dek_wrapped).
  bytes dek_wrapped = 2;
  // kek_id names the key that wraps it, so a host holding more than one (a
  // rotation in progress, a migrated fleet) knows which to unwrap with.
  string kek_id = 3;
  // dek_key_id is the DEK's own version — RecordHeader.KeyID, the field that lets
  // §15.1 rotation re-key new data without re-encrypting history. It travels with
  // dek_wrapped because a wrapped key and another key's version describe a volume
  // nothing can open.
  //
  // It is never 0. On the WAL path 0 means "plaintext record" (§14.1), so
  // wal.NewEncryption refuses it and volumes.dek_key_id carries a CHECK that keeps
  // it out of the catalog. A host that receives 0 here has been handed a volume it
  // must decline rather than serve in the clear.
  uint32 dek_key_id = 4;
}

// VolumeRefusal is why an Agent is not serving a volume the fleet placed on it.
//
// The Agent fails closed in five places, and every one of them was correct and every
// one of them was invisible to the fleet: a volume that refuses to serve keeps
// reporting the watermarks its last healthy session left behind, so the catalog reads
// normal, `-fleet-status` prints a normal row, and the operator's only signal is one
// ERROR line in one host's log at attach time, followed by silence. This field is what
// turns that into a fact the fleet holds.
//
// **An enum and not a free string, and the choice is worth arguing because both are
// defensible.** A string needs no wire change when a new refusal appears and carries the
// Agent's own sentence. But the string it would actually carry is `err.Error()`, which
// embeds a volume id and a sequence number, so no two reports ever compare equal, the
// `-fleet-status` column becomes a vocabulary nobody controls, and the first alert
// anyone writes on it matches a substring of a sentence somebody is free to reword. The
// set below is closed by construction — every value is a decision made at a named line
// in internal/agent — so a new refusal is a new code path in this repository, and
// extending this enum is the same commit that adds it. The cost of the closed set falls
// on the person already editing both sides, which is the only place it is cheap.
//
// The sentence is carried anyway, next to it, as `refusal_detail`: nothing branches on
// it, and it is what an operator's *next step* needs — which sequence, which KEK. Same
// split as the snapshot fields above, an id to act on and a sentence to read.
enum VolumeRefusal {
  // UNSPECIFIED is the Agent saying it is serving the volume. That is what makes the
  // field self-clearing rather than something a sweep has to notice: the proto3 default
  // is the healthy value, so an Agent that recovers reports it without doing anything,
  // and an Agent built before this field says the true thing about itself by omission.
  VOLUME_REFUSAL_UNSPECIFIED = 0;
  // The catalog says this volume published an image and the object store holds none
  // (agent.ErrImageMissing): a stray delete, a lifecycle expiry, a restore that missed
  // one key. Look at the bucket.
  VOLUME_REFUSAL_IMAGE_MISSING = 1;
  // The volume came back below the sequence a guest was already told was durable
  // (agent.ErrDurabilityLost): this host's local WAL was lost with writes in it, and
  // what is in the bucket is genuinely older than what the fleet promised.
  VOLUME_REFUSAL_DURABILITY_LOST = 2;
  // The read view never resolved, so every read fails and the session will not be
  // published (agent.ErrNoReadView, wal.ErrBaseUnavailable) — an unreadable ancestry,
  // an object store that would not answer.
  VOLUME_REFUSAL_NO_READ_VIEW = 3;
  // The catalog says the volume is encrypted and this host holds no KEK, or holds a
  // different one (agent.ErrNoKEK). One missing flag on one process, or a
  // key-distribution problem — the detail says which.
  VOLUME_REFUSAL_NO_KEY = 4;
  // The host lease lapsed on the Agent's own monotonic clock and it gave the device up
  // rather than keep answering for a volume it can no longer confirm it owns (§12.2).
  VOLUME_REFUSAL_LEASE_LOST = 5;
  // Everything else that stopped the runtime from starting: a socket that could not be
  // bound, a WAL that would not resume, this host's own -max-volumes ceiling. A
  // catch-all on purpose — without one, the next refusal to be written would be
  // invisible again, which is the whole failure this enum exists to close.
  VOLUME_REFUSAL_ATTACH_FAILED = 6;
  // The compare-and-set on this volume's HEAD lost: another host published a commit for
  // it, so this one is not its writer any more (commit.ErrHeadMoved, v6 §15).
  //
  // Its own value rather than the catch-all, which the catch-all's comment would
  // otherwise cover, because the operator's next move is not the same and is not
  // guessable from a detail string. Every other refusal here is answered by looking at
  // this host; this one is answered by looking at *ownership* — who else believes it
  // owns this volume, and why was this host not fenced first. Two hosts writing one
  // volume is the failure this whole design is arranged against, and it is the one
  // refusal that must be countable in a dashboard rather than greppable in a log.
  VOLUME_REFUSAL_PUBLISH_FENCED = 7;
}

// VolumeReport is one volume's watermarks as the Agent observes them, qualified
// by the epoch under which they were produced.
message VolumeReport {
  string volume_id = 1;
  // epoch is the epoch this Agent believes it holds the volume under. A report
  // whose epoch is not the volume's current one is refused: it comes from a
  // writer that has been fenced.
  int64 epoch = 2;
  // Watermarks are informative (§5.8) and must satisfy
  // published <= durable <= local (INV-03).
  int64 local_sequence = 3;
  int64 durable_sequence = 4;
  int64 published_sequence = 5;
  // remote_gap_bytes is this volume's share of the device's remote backlog.
  int64 remote_gap_bytes = 6;

  // snapshot_id is the pending snapshot this host has finished acting on, empty when
  // it has nothing to say. The three fields below are one answer and are read
  // together: an id plus a sequence is "published at N", an id plus an error is
  // "FAILED, and here is what an operator needs to read".
  //
  // It is reported on the volume's own report rather than through a call of its own
  // because the report is already the Agent's one channel for "what is true here",
  // and a second channel would need its own retry, its own ordering against the
  // watermarks, and its own way of being refused when the host has been fenced.
  string snapshot_id = 7;
  // snapshot_sequence is the §19 sequence the copy was frozen at — the volume's
  // local_sequence at the instant of the capture, and what makes the snapshot a
  // point rather than an interval.
  int64 snapshot_sequence = 8;
  // snapshot_error, when set, is why the snapshot could not be taken. A snapshot
  // that fails silently stays CREATING forever and nothing ever collects it.
  string snapshot_error = 9;

  // refusal says this host is **not serving** the volume, and why; unset is it saying
  // it is. It is reported for a volume the Agent started and then failed closed on
  // (the read view never resolved) and for one it never managed to start at all, which
  // is the case that used to produce no report whatsoever — the volume simply stopped
  // appearing on the wire, and an absence is not a signal.
  //
  // The watermarks on a refused report are this host's honest zeros or whatever its
  // WAL replayed, and they are safe next to a refusal precisely because the Control
  // Plane merges them with GREATEST: a volume that could not open reports nothing that
  // can pull the catalog's numbers backwards. The refusal itself is not merged that
  // way — see SetVolumeRefusal, which is qualified by this host and this epoch, so a
  // writer the fleet has moved past cannot mark a volume its successor is serving.
  VolumeRefusal refusal = 10;
  // refusal_detail is the sentence behind it, verbatim from the Agent, empty when
  // there is no refusal. `-fleet-status` prints it and nothing branches on it: it
  // carries the numbers the enum cannot — which sequence was ACKed, which KEK is
  // missing — and those are what an operator's next step is chosen from.
  string refusal_detail = 11;
}

message ReportVolumeStateRequest {
  string host_id = 1;
  repeated VolumeReport volumes = 2;
}

// ReportOutcome says what happened to one report. A refusal is information the
// Agent acts on — STALE_EPOCH or NOT_PRIMARY means this host is no longer the
// writer and must stop behaving like one.
enum ReportOutcome {
  REPORT_OUTCOME_UNSPECIFIED = 0;
  // ACCEPTED: the watermarks were applied (or were already at least as high —
  // each watermark is monotonic, so a late report is not an error).
  REPORT_OUTCOME_ACCEPTED = 1;
  // STALE_EPOCH: the volume has moved past the epoch the report names.
  REPORT_OUTCOME_STALE_EPOCH = 2;
  // NOT_PRIMARY: this host is not the volume's primary.
  REPORT_OUTCOME_NOT_PRIMARY = 3;
  // UNKNOWN_VOLUME: the Control Plane has no such volume.
  REPORT_OUTCOME_UNKNOWN_VOLUME = 4;
  // OUT_OF_ORDER: the report violates published <= durable <= local (INV-03).
  REPORT_OUTCOME_OUT_OF_ORDER = 5;
}

message VolumeReportResult {
  string volume_id = 1;
  ReportOutcome outcome = 2;
}

message ReportVolumeStateResponse {
  // results is one entry per reported volume, in the order they were reported.
  repeated VolumeReportResult results = 1;
}
