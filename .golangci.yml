# golangci-lint v2 config for github.com/spin-stack/storage.
#
# The authoritative §25.1 / INV-01 check is the custom `simulable` analyzer
# (hack/analyzers/simulable), run as its own CI/Taskfile step and covered by
# golden tests. The forbidigo + depguard rules below are the belt-and-suspenders
# layers described in ADR-0003: they catch the common escapes directly in
# golangci-lint so a violation fails `task lint` even before the custom analyzer
# runs.
version: "2"

run:
  concurrency: 8
  allow-parallel-runners: true

linters:
  enable:
    - depguard
    - forbidigo
    - usetesting
  settings:
    usetesting:
      context-background: true
      context-todo: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.(Now|Since|Sleep|After|Tick|Until|NewTimer|NewTicker)$'
          msg: "§25.1/INV-01: use internal/simio/clock, not the time package directly"
        - pattern: '^net\.(Dial|DialTimeout|DialTCP|DialUDP|DialIP|DialUnix|Listen|ListenTCP|ListenUDP|ListenUnix|ListenPacket)$'
          msg: "§25.1/INV-01: use internal/simio/net, not the net package directly"
        - pattern: '^os\.(Open|Create|OpenFile|ReadFile|WriteFile|Remove|RemoveAll|Mkdir|MkdirAll|Rename|Truncate)$'
          msg: "§25.1/INV-01: use internal/simio/disk, not the os package directly"
        - pattern: '^uuid\.(New|NewString|NewRandom)$'
          msg: "INV-22/ADR-0007: all ids are UUIDv7 — use internal/ids.New, not the v4 generators"
    depguard:
      rules:
        outside-simio:
          list-mode: lax
          deny:
            - pkg: syscall
              desc: "§25.1/INV-01: raw syscalls only inside internal/simio/real"
  exclusions:
    generated: lax
    rules:
      # internal/simio and its real/sim implementations are the sanctioned home
      # of the real primitives (ADR-0003).
      - path: internal/simio
        linters:
          - depguard
          - forbidigo
      # cmd/ mains are where the real world is wired up: INV-01 puts the real
      # implementations behind simio, and their *construction* in main. The one
      # thing that needs the syscall package here is signal handling
      # (syscall.SIGTERM — a daemon that ignores it is not deployable), and Go
      # offers no other spelling of it. Narrow on purpose: only depguard, only
      # cmd/, and the authoritative simulable analyzer still runs over cmd/, so a
      # real read/write/fsync smuggled into a main is still a failure.
      - path: (^|/)cmd/
        linters:
          - depguard
      # Build-tagged test harnesses drive the real world, which is the whole reason
      # they exist. `integration/**`'s host-side lanes start QEMU and wait for it;
      # internal/testinfra starts containers and subprocesses. There is no clock to
      # inject into another *process*, and a harness that waited on a simulated one
      # would be measuring nothing — INV-01 governs production code, and none of this
      # is linked into a binary this repository ships (every file here carries a
      # build tag).
      #
      # Narrow deliberately, and the narrowness is enforced, not asserted: the
      # exemption is by path *and* the paths are all tagged, ordinary unit tests stay
      # governed (a time.Now() there is how simulable code gets bypassed), and the
      # simulable analyzer keeps its own fixture proving a host-side package under
      # integration/ is still flagged when it is not a harness.
      - path: (^|/)integration/.*_test\.go$
        linters:
          - depguard
          - forbidigo
      - path: internal/testinfra/
        linters:
          - depguard
          - forbidigo
      # The AWS SDK's manager.Uploader is deprecated in favour of a package that does
      # not exist in this SDK version yet. It is used in exactly one place, and for a
      # reason no replacement changes: §6.1 requires the conformance suite to prove a
      # *multipart* upload's ETag is not a checksum, and this is what performs one.
      - path: integration/backend/edgecases_test\.go
        linters:
          - staticcheck
      # analyzer golden fixtures deliberately contain violations.
      - path: hack/analyzers/.*/testdata/
        linters:
          - depguard
          - forbidigo
      # cleanup calls whose error is intentionally ignored.
      - linters:
          - errcheck
        text: "Error return value of.*(Close|Remove|Sync)` is not checked"
      # internal/ids is the sanctioned home of UUID generation (INV-22).
      - path: internal/ids
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    # Generated code is formatted by its generator, not by us. The linters honour
    # `exclusions.generated`, but formatters take their own list, so without this the
    # gate reports protoc-gen-go's import grouping as our formatting error — and the
    # only way to "fix" it is to hand-edit a file whose header says DO NOT EDIT.
    generated: lax
    paths:
      - api/gen
      - internal/db
